const qs2 = [
{id:201,topic:'epidemiology',book:true,source:'CNPP 8th Ed — Ch. Care Continuum',
 q:"According to research comparing breast health outcomes, which of the following statements best describes the breast health of African American women of lower socioeconomic status (SES) compared to age-adjusted Caucasian women?",
 opts:["Breast cancer outcomes in minority women with a lower SES are worse than those with a higher SES.","Premature deaths from breast cancer in African American women are similar to non-Hispanic white women.","Survival of breast cancer was improved with higher SES for members of all racial and ethnic groups.","African American women are more commonly diagnosed with triple-negative breast cancer."], ans:0,
 exp:"African American women of lower SES obtain fewer mammograms, experience premature deaths, and have lower survival rates. Research has shown TNBC is more common in African American women but does not directly relate to SES. CNPP Pages 1281–1287."
},
{id:202,topic:'treatment',book:true,source:'CNPP 8th Ed — Health Promotion',
 q:"The Breast Cancer Prevention Trial (BCPT) was a landmark chemoprevention study in healthy high-risk women. The Breast Cancer Prevention Trial tested the ability of which of the following to prevent breast cancer in healthy women at high risk for the disease?",
 opts:["Raloxifene","Retinoic acid","Tamoxifen","Beta-carotene"], ans:2,
 exp:"The Breast Cancer Prevention Trial (BCPT/P-1) tested tamoxifen as a chemopreventive agent. The STAR trial compared tamoxifen and raloxifene — both were equally effective in reducing invasive breast cancer risk. CNPP Page 88."
},
{id:203,topic:'genetics',book:true,source:'CNPP 8th Ed — Genetic Risk',
 q:"Mrs. Zafira Al-Qahtani, a 38-year-old woman with a confirmed BRCA1 mutation, asks about the strongest evidence-based reason for choosing risk-reduction bilateral mastectomy. Which statement is the best reason to recommend this surgery for a woman with high genetic risk of breast cancer?",
 opts:["Removal of the breasts before cancer detection lowers risk by 90%.","Removal of the breasts before cancer detection lowers risk by 80%.","Removal of the breasts will decrease the risk of ovarian cancer.","Removal of the breasts will decrease the risk of both ovarian and breast cancer."], ans:0,
 exp:"Prophylactic bilateral mastectomy reduces breast cancer risk by approximately 90% in BRCA1/2 mutation carriers and other high-risk women. This is the most effective surgical risk-reduction strategy. CNPP Page 161."
},
{id:204,topic:'risk',book:true,source:'CNPP 8th Ed — Risk Models',
 q:"Mrs. Sarab Al-Harbi, a 44-year-old woman with multiple risk factors for breast cancer, is referred to a risk assessment clinic. The nurse uses a validated tool to calculate her 5-year and lifetime risk. Which of the following models has been developed for use in women with a risk for developing breast cancer?",
 opts:["Couch","Bethesda","Gail","Lynch"], ans:2,
 exp:"The Gail Model (Breast Cancer Risk Assessment Tool/BCRAT) is a validated risk assessment tool that calculates 5-year and lifetime risk of developing breast cancer based on age, menarche age, first birth age, biopsies, relatives, and race. CNPP Page 163."
},
{id:205,topic:'diagnosis',book:true,source:'CNPP 8th Ed — Breast in Pregnancy',
 q:"Mrs. Anwar Al-Ghamdi, a 26-year-old woman who is 18 weeks pregnant, discovers a mass in her left breast. Following her physical examination, which diagnostic test is the physician MOST likely to order first?",
 opts:["Ultrasound","Fine-needle aspiration","Mammogram (diagnostic)","MRI"], ans:0,
 exp:"Ultrasound is the preferred initial imaging for pregnant women with a breast mass as it avoids ionizing radiation. If ultrasound is inconclusive, mammography with abdominal shielding may be used. Biopsy is safe in pregnancy. CNPP Page 1303."
},
{id:206,topic:'navigation',book:true,source:'CNPP 8th Ed — Navigation',
 q:"Ms. Rawan Al-Rashidi, a newly hired breast care navigator, is asked by her supervisor to conduct a needs assessment for mammography screening in her catchment area. Your best source of statistics about screening mammography in the population you serve is:",
 opts:["Medicare and Medicaid data regarding compliance with annual screening mammography and demographic data (geographic, economic, age)","American Cancer Society publications","NCI data only","Breast health center data regarding number of women screened annually"], ans:0,
 exp:"Medicare/Medicaid data provides the most comprehensive source — compliance rates for screening mammography linked to demographic data including geographic location, economic status, and age groups. CNPP Page 62."
},
{id:207,topic:'navigation',book:true,source:'CNPP 8th Ed — Navigation',
 q:"Mrs. Yara Al-Dosari, a 49-year-old woman, receives a diagnostic mammogram showing a suspicious mass. The surgeon tells her he wants her to meet the patient navigator. The best explanation for this referral is:",
 opts:["You don't have insurance, so the navigator must discuss costs before we continue your care.","We are planning surgery and the navigator will support you through the entire process.","The navigator will provide you with a list of surgeons for your biopsy.","The navigator is bilingual and will explain everything in your first language."], ans:1,
 exp:"Patient navigators identify and resolve barriers to care, provide education and emotional support, coordinate care, and ensure timely follow-up after an abnormal finding — particularly during the transition from diagnosis to treatment. CNPP Page 65."
},
{id:208,topic:'navigation',book:true,source:'CNPP 8th Ed — Navigation',
 q:"A breast care navigation program director wants to evaluate the effectiveness of her program. The most useful metric to measure the success of breast care navigation is:",
 opts:["Increasing the number and percent of women having screening mammography from the targeted geographic region","Decreasing the percentage of patients needing transportation","Increasing the number of breast health education programs","Increasing revenue to the breast health center"], ans:0,
 exp:"The most meaningful measure of breast care navigation success is increasing screening mammography compliance in the targeted population — this directly impacts early detection rates and outcomes. CNPP Page 62."
},
{id:209,topic:'epidemiology',book:true,source:'CNPP 8th Ed — Epidemiology',
 q:"An oncology nurse educator is teaching a global health module. The highest breast cancer incidence rates in the world are found in:",
 opts:["North America and Northern Europe","Asia and Africa","South America","Australia and New Zealand"], ans:0,
 exp:"The highest incidence rates of breast cancer are found in North America and Northern Europe (high-income, westernized countries). The lowest rates are in Asia and Africa. Incidence is rising in developing countries as lifestyles westernize. CNPP Pages 1281–1287."
},
{id:210,topic:'risk',book:true,source:'CNPP 8th Ed — Risk Factors',
 q:"Mrs. Shaikha Al-Shehri, a 48-year-old Saudi woman, comes to the breast clinic for a risk assessment. When asked about primary risk factors, the nurse knows that a primary risk factor for breast cancer is:",
 opts:["Age in the 30- to 45-year group","Family history of breast cancer","Two or more heterosexual relationships","Lower socioeconomic status"], ans:1,
 exp:"Family history of breast cancer (especially first-degree relatives) is one of the primary modifiable/non-modifiable risk factors. Risk increases significantly with the number of affected relatives and their age at diagnosis. CNPP Page 1287."
},
{id:211,topic:'genetics',book:true,source:'CNPP 8th Ed — BRCA',
 q:"Mrs. Sumayyah Al-Mutairi, a 40-year-old woman, is referred to a genetics clinic after her brother was diagnosed with breast cancer. The genetic counselor reviews BRCA2. Which of the following statements regarding the BRCA2 gene mutation is true?",
 opts:["The BRCA2 gene mutation is associated with postmenopausal breast cancer.","The BRCA2 gene mutation is only associated with breast cancer.","The BRCA2 gene mutation is genetically related to the BRCA1 gene.","The BRCA2 gene mutation is related to breast cancer in men."], ans:3,
 exp:"BRCA2 mutations are specifically associated with male breast cancer (6% lifetime risk vs 0.1% in general male population). BRCA2 is also associated with ovarian cancer, pancreatic cancer, prostate cancer, and melanoma. CNPP Pages 1291–1292."
},
{id:212,topic:'genetics',book:true,source:'CNPP 8th Ed — BRCA',
 q:"During a genetics lecture, a nursing student is asked about the percentage of breast cancers attributable to BRCA mutations. Which of the following statements regarding breast cancer risk is accurate?",
 opts:["Only 5–10% of all breast cancers are due to tumor suppressor genes BRCA1 and BRCA2.","Breast cancers linked to BRCA1/BRCA2 mutations occur more often in older women.","A woman with strong family history of BC has a 10% chance of an inherited BRCA mutation.","The number of second-degree relatives with breast cancer is not a significant risk factor."], ans:0,
 exp:"Only 5–10% of all breast cancers are hereditary (due to BRCA1/BRCA2 or other high-penetrance mutations). BRCA-related cancers typically occur in younger women (before 50). A strong family history actually confers ~30% chance of inherited mutation. CNPP Page 1289."
},
{id:213,topic:'genetics',book:true,source:'CNPP 8th Ed — BRCA1',
 q:"Mrs. Majdah Al-Zahrani, a 39-year-old woman with a strong family history of breast and ovarian cancer, is found to carry a BRCA1 mutation. The genetic counselor explains the significance of this gene. Which of the following statements best describes the significance of the BRCA1 gene?",
 opts:["It identifies women ensured of having breast cancer during premenopausal years.","It is an inherited gene mutation that identifies families at significant risk for breast cancer and ovarian cancer.","It identifies women likely to have breast cancer in postmenopausal years.","It is present in over 90% of women with breast cancer."], ans:1,
 exp:"BRCA1 is a tumor suppressor gene. Inherited mutations identify families at high risk for breast cancer (55–72% lifetime risk) AND ovarian cancer (44% lifetime risk). It is the hallmark of Hereditary Breast and Ovarian Cancer (HBOC) syndrome. CNPP Page 1289."
},
{id:214,topic:'genetics',book:true,source:'CNPP 8th Ed — Hereditary Genetics',
 q:"A genetics intern is asked about the relationship between BRCA mutations and both breast and ovarian cancer susceptibility. Which statement regarding genetic susceptibility in breast and ovarian cancer is correct?",
 opts:["The BRCA1 mutation is associated with susceptibility to only ovarian cancer.","The BRCA2 mutation is associated with increased susceptibility to both breast and ovarian cancer.","One gene mutation is present in approximately 35% of breast cancer cases.","Both genes are associated with breast cancer diagnosed only in post-menopausal women."], ans:1,
 exp:"BRCA2 mutations increase susceptibility to both breast cancer AND ovarian cancer (10–17% lifetime risk for ovarian). BRCA1 mutations confer even higher ovarian cancer risk (~44%). Combined, BRCA1/2 account for only 5–10% of all breast cancers. CNPP Page 1289."
},
{id:215,topic:'genetics',book:true,source:'CNPP 8th Ed — Hereditary BC Counseling',
 q:"Mrs. Tahani Al-Qahtani, a 47-year-old woman with hereditary breast cancer (not BRCA1/2-related), has completed treatment. Her oncologist recommends genetic counseling. The best reason to recommend genetic counseling in this specific case is:",
 opts:["Women younger than 50 with hereditary breast cancer have significant risk of contralateral breast cancer over the next 20 years.","It is precautionary to ensure she doesn't develop BRCA-related cancer.","Counseling helps decide if she is a candidate for adjuvant chemotherapy.","Counseling helps decide if she is a candidate for prophylactic oophorectomy."], ans:0,
 exp:"Women with hereditary breast cancer diagnosed before age 50 have a significant risk of contralateral breast cancer (up to 40% over 20 years), making genetic counseling important for ongoing surveillance, contralateral risk reduction, and family implications. CNPP Page 1292."
},
{id:216,topic:'diagnosis',book:true,source:'CNPP 8th Ed — Prognostic Factors',
 q:"Mrs. Alaa Al-Harbi, a 44-year-old woman diagnosed with breast cancer, is confused about the meaning of her hormone receptor and HER2 test results. She asks the nurse to explain. Which of the following best clarifies the role of hormone receptor analysis and HER2 testing?",
 opts:["Hormone receptor analysis determines likelihood of metastases only.","Hormone receptor and HER2 assessment are used to decide treatment for metastatic disease only.","Hormone receptor and HER2 assessment determine treatment strategies and prognosis for both local and advanced disease.","Women with hormone receptor-positive tumors do not require further treatment beyond surgery."], ans:2,
 exp:"Both hormone receptor status (ER/PR) and HER2 are crucial biomarkers that guide treatment decisions and prognosis for ALL stages — early-stage (adjuvant endocrine therapy/trastuzumab) and metastatic disease. CNPP Pages 1297–1302."
},
{id:217,topic:'epidemiology',source:'CNPP Level',
 q:"Mrs. Buthaina Al-Ghamdi, a 52-year-old post-menopausal woman with newly diagnosed breast cancer, asks the nurse about cancer survival trends. Which statement about breast cancer mortality trends is correct?",
 opts:["The number of breast cancer survivors is declining due to reduced incidence","Breast cancer is one of the most common diagnoses among the growing cancer survivor population","Survival rates for breast cancer have remained unchanged over the past 20 years","The majority of breast cancer survivors are men"], ans:1,
 exp:"Breast cancer is one of the most prevalent cancers among survivors due to both high incidence and improving survival rates. The 5-year relative survival rate for all stages combined is approximately 90%, contributing to a large and growing survivor population."
},
{id:218,topic:'epidemiology',source:'CNPP Level',
 q:"Mrs. Tayba Al-Rashidi, a 57-year-old post-menopausal woman with a BMI of 32, asks her oncology nurse about the mechanism by which her weight affects her breast cancer risk. The nurse explains that obesity increases breast cancer risk in post-menopausal women primarily through:",
 opts:["Mortality has been increasing steadily since 1990","Mortality peaked in 1989 and has declined significantly due to screening and improved treatment","Mortality is unchanged despite advances in treatment","Mortality has only decreased in post-menopausal women"], ans:1,
 exp:"Breast cancer mortality peaked in 1989 at 33.2/100,000 and declined 39% by 2015 (saving 322,600 lives). This decline is attributed to both improved mammography screening (early detection) and improved systemic therapies."
},
{id:219,topic:'risk',source:'CNPP Level',
 q:"Mrs. Budoor Al-Dosari, a 45-year-old woman, presents for a breast cancer risk assessment. Her history reveals BRCA1 mutation AND two first-degree relatives with breast cancer. Which of the following combinations represents the HIGHEST overall risk for developing breast cancer?",
 opts:["Decreased physical activity alone","Increased peripheral aromatization of androgens to estrogen in adipose tissue","Decreased immune function","Increased dietary fat intake"], ans:1,
 exp:"In postmenopausal women, adipose tissue becomes the primary site of estrogen production through aromatization of androgens. Obesity increases estrogen levels, which stimulates breast tissue proliferation. Obesity increases postmenopausal BC risk by approximately 30%."
},
{id:220,topic:'risk',source:'CNPP Level',
 q:"Mrs. Fareeha Al-Shehri, a 50-year-old post-menopausal woman on combined estrogen-progestin HRT for 3 years, asks about her breast cancer risk. Hormone replacement therapy with combined estrogen-progestin is associated with which breast cancer risk?",
 opts:["Decreased risk with long-term use","2.9% increased relative risk per year of use at menopause","No significant association after menopause","Increased risk only in BRCA mutation carriers"], ans:1,
 exp:"Combined estrogen-progestin HRT increases breast cancer risk by approximately 2.9% per year of use at menopause. The Women's Health Initiative study (2002) demonstrated this association. Estrogen-only HRT (in women post-hysterectomy) has less risk than combined HRT."
},
{id:221,topic:'risk',source:'CNPP Level',
 q:"Ms. Rawan Al-Mutairi, a 40-year-old woman, asks when she should start getting mammograms. The nurse explains current ACS guidelines. According to current guidelines, what should the nurse tell a 40-year-old average-risk woman about mammography screening?",
 opts:["Annual mammography is not recommended until age 50","She can begin annual mammography at age 40 to maximize early detection","Mammography is contraindicated in women under 45","Ultrasound alone is sufficient for screening at her age"], ans:1,
 exp:"The American Cancer Society recommends that women at average risk should have the OPPORTUNITY to begin annual mammography screening at age 40. Guidelines vary by organization but annual screening from 40 is supported by ACS and NCCN."
},
{id:222,topic:'diagnosis',source:'CNPP Level',
 q:"Mrs. Eman Al-Zahrani, a 48-year-old woman, asks the nurse to explain the difference between a screening mammogram and a diagnostic mammogram. The nurse's best response is:",
 opts:["They are the same procedure performed on different populations","A screening mammogram is for asymptomatic women; diagnostic mammogram is for women with symptoms or abnormal screening","Diagnostic mammograms use MRI technology","Screening mammograms require a physician's order; diagnostic do not"], ans:1,
 exp:"Screening mammography is performed on asymptomatic women at regular intervals for early detection. Diagnostic mammography is performed on women with symptoms (lump, discharge, skin changes), abnormal screening results, or prior breast cancer. Diagnostic mammograms involve more views and immediate radiologist interpretation."
},
{id:223,topic:'diagnosis',source:'CNPP Level',
 q:"Mrs. Ranah Al-Qahtani, a 50-year-old woman, is scheduled for a core needle biopsy of a suspicious breast mass. She asks how this differs from a fine needle aspiration (FNA). Compared to FNA, core needle biopsy:",
 opts:["Provides less tissue but is more accurate","Provides more tissue allowing histologic diagnosis and receptor testing","Cannot determine hormone receptor status","Requires general anesthesia"], ans:1,
 exp:"Core needle biopsy (CNB) provides a core of tissue (vs. cells only with FNA), allowing histologic diagnosis, grading, and receptor testing (ER, PR, HER2, Ki-67). It is the preferred method for initial breast cancer diagnosis. It is performed under local anesthesia with image guidance."
},
{id:224,topic:'diagnosis',source:'CNPP Level',
 q:"Mrs. Manar Al-Harbi, a 48-year-old woman with clinically node-negative breast cancer, is scheduled for sentinel lymph node biopsy (SLNB). She asks about the procedure. Which of the following is a TRUE statement about SLNB in breast cancer?",
 opts:["SLNB requires removal of all axillary lymph nodes","A negative SLNB means the cancer has not spread to any lymph nodes in the body","A negative SLNB allows avoidance of complete axillary lymph node dissection (ALND)","SLNB is only performed in metastatic breast cancer"], ans:2,
 exp:"If the sentinel lymph node is pathologically negative, complete axillary lymph node dissection can be avoided — reducing the risk of lymphedema and other morbidities. SLNB is standard for clinically node-negative early breast cancer (T1-T2)."
},
{id:225,topic:'diagnosis',source:'CNPP Level',
 q:"Mrs. Ola Al-Ghamdi, a 53-year-old woman with ER+/HER2−, node-negative breast cancer, has an Oncotype DX recurrence score of 15. The oncology nurse explains what this means for her treatment plan. An Oncotype DX score of 15 means:",
 opts:["High risk of recurrence — chemotherapy is strongly recommended","Low risk of recurrence — endocrine therapy alone is appropriate","Intermediate risk — chemotherapy may provide benefit","The test is invalid and should be repeated"], ans:1,
 exp:"Oncotype DX: Low risk <18 (endocrine therapy alone, no chemotherapy benefit), Intermediate 18-25 (consider patient factors), High risk >25 (chemotherapy + endocrine therapy). A score of 15 is low risk; endocrine therapy alone provides adequate benefit (TAILORx trial)."
},
{id:226,topic:'treatment',source:'CNPP Level',
 q:"Mrs. Dana Al-Rashidi, a 46-year-old woman with newly diagnosed HER2+ breast cancer, is about to start trastuzumab. The nurse's priority assessment BEFORE initiating therapy is:",
 opts:["Complete blood count","Liver function tests","Left ventricular ejection fraction (LVEF/echocardiogram)","Renal function tests"], ans:2,
 exp:"Trastuzumab causes cardiotoxicity (decreased LVEF/cardiomyopathy) in 2-7% of patients. Baseline LVEF must be assessed before starting trastuzumab, and monitoring every 3 months during therapy is required. If LVEF drops >10% or below institutional normal, trastuzumab should be held."
},
{id:227,topic:'treatment',source:'CNPP Level',
 q:"Mrs. Safaa Al-Dosari, a 47-year-old woman with locally advanced breast cancer, is receiving neoadjuvant chemotherapy. She asks the nurse about the PRIMARY goal of this approach. The primary goal of neoadjuvant chemotherapy is:",
 opts:["Prevent bone metastases","Downstage the tumor to allow breast-conserving surgery or to assess treatment response","Replace surgery entirely","Treat already-present distant metastases"], ans:1,
 exp:"Primary goals of neoadjuvant chemotherapy include: (1) downstaging the tumor to allow breast-conserving surgery instead of mastectomy, (2) treating micrometastatic disease early, and (3) assessing in vivo chemosensitivity. Pathologic complete response (pCR) is associated with improved long-term outcomes."
},
{id:228,topic:'treatment',source:'CNPP Level',
 q:"Mrs. Arwa Al-Shehri, a 49-year-old woman, has a lumpectomy for stage I breast cancer. She asks why she needs radiation therapy if her surgeon got clear margins. The nurse's best response is:",
 opts:["Radiation is given to treat lymph node metastases","Radiation reduces the risk of local recurrence in the remaining breast tissue by 50-70%","Radiation therapy replaces the need for chemotherapy","Radiation prevents distant metastases"], ans:1,
 exp:"Post-lumpectomy radiation reduces local recurrence in the remaining breast tissue by 50-70%. Studies (NSABP B-06) showed that lumpectomy + radiation has equivalent survival to mastectomy. Without radiation after BCT, local recurrence rates are significantly higher (~30% vs ~8% with radiation)."
},
{id:229,topic:'treatment',source:'CNPP Level',
 q:"Mrs. Basma Al-Mutairi, a 52-year-old woman on letrozole, reports significant joint pain and morning stiffness in her hands and knees for the past 2 months. The nurse recognizes this as:",
 opts:["Bone metastases requiring immediate imaging","Aromatase inhibitor-associated musculoskeletal syndrome (AIMSS) — a known side effect","Sign of disease progression","Peripheral neuropathy from prior chemotherapy"], ans:1,
 exp:"Aromatase inhibitor-associated musculoskeletal syndrome (AIMSS) affects 25-50% of patients on AIs, presenting as joint pain, stiffness, and/or myalgias (especially morning stiffness). Management includes exercise, NSAIDs, glucosamine, vitamin D/calcium, or switching to another AI. It is the most common reason for AI non-adherence."
},
{id:230,topic:'treatment',source:'CNPP Level',
 q:"Mrs. Kholoud Al-Zahrani, a 46-year-old woman, calls the nurse after her first chemotherapy cycle reporting nausea immediately upon leaving the infusion center. This type of nausea is classified as:",
 opts:["Anticipatory nausea","Acute nausea","Delayed nausea","Breakthrough nausea"], ans:1,
 exp:"Acute nausea/vomiting occurs within 24 hours of chemotherapy administration — including immediately after. Anticipatory nausea occurs BEFORE treatment (conditioned response). Delayed nausea occurs 24+ hours after. Acute nausea is primarily mediated by serotonin (5-HT3) — treated with 5-HT3 antagonists (ondansetron)."
},
{id:231,topic:'nursing',source:'CNPP Level',
 q:"Mrs. Tahany Al-Qahtani, a 49-year-old woman, has an ANC of 450/mm³ after her chemotherapy cycle. Which nursing priority is MOST appropriate?",
 opts:["Administer growth factors without physician order","Institute neutropenic precautions and monitor for fever (T ≥38.3°C/101°F)","Restrict all visitors and maintain strict isolation","Discontinue all IV access to reduce infection risk"], ans:1,
 exp:"ANC <500/mm³ = severe neutropenia (nadir). Nursing priorities: institute neutropenic precautions (hand hygiene, avoid crowds/sick contacts), monitor temperature q4-8h (T ≥38.3°C = febrile neutropenia = medical emergency requiring immediate broad-spectrum antibiotics)."
},
{id:232,topic:'nursing',source:'CNPP Level',
 q:"Mrs. Shuaa Al-Harbi, a 48-year-old woman, receives IV doxorubicin. She reports burning pain at the IV site, and the nurse observes redness and swelling around the catheter. The priority nursing action is:",
 opts:["Apply a warm compress and continue the infusion","Stop the infusion immediately and follow extravasation protocol","Increase the infusion rate to dilute the drug","Apply ice and continue monitoring"], ans:1,
 exp:"Doxorubicin is a vesicant — extravasation causes severe tissue necrosis. IMMEDIATE action: STOP infusion, leave catheter in place, aspirate residual drug, notify physician, administer dexrazoxane (antidote for anthracycline extravasation within 6 hours), document, and apply COLD packs per protocol."
},
{id:233,topic:'nursing',source:'CNPP Level',
 q:"Mrs. Najd Al-Ghamdi, a 51-year-old woman on capecitabine for metastatic breast cancer, presents with Grade 2 painful redness and swelling of her palms and soles. This is classified as:",
 opts:["Grade 1 hand-foot syndrome — continue current dose","Grade 2-3 hand-foot syndrome (palmar-plantar erythrodysesthesia) — dose modification required","Radiation recall reaction","Contact dermatitis — no dose change needed"], ans:1,
 exp:"Grade 2 HFS: painful erythema and swelling with functional limitation — interrupt capecitabine until resolved to Grade 0-1, then resume at reduced dose. Grade 3: severe ulceration/blistering preventing ADLs — same management with greater dose reduction. Urea-based creams, avoiding pressure/heat, and dose modification are mainstays."
},
{id:234,topic:'nursing',source:'CNPP Level',
 q:"Mrs. Bushra Al-Rashidi, a 53-year-old woman, comes for her 2-year survivorship follow-up after breast cancer treatment. She asks what long-term effects she should be monitored for. The nurse's response should include:",
 opts:["Only local recurrence — no systemic effects after 2 years","Cardiac effects from anthracyclines, lymphedema, bone loss from endocrine therapy, and cognitive changes","Only bone metastases since she was node-positive","Side effects resolve completely within 6 months of treatment completion"], ans:1,
 exp:"Long-term survivorship effects of breast cancer treatment include: cardiotoxicity (anthracyclines/trastuzumab), lymphedema (axillary surgery/radiation), bone loss/osteoporosis (aromatase inhibitors), cognitive changes ('chemo brain'), neuropathy (taxanes), and psychosexual effects. Ongoing monitoring is essential."
},
{id:235,topic:'nursing',source:'CNPP Level',
 q:"Mrs. Thurayya Al-Dosari, a 47-year-old woman, is discharged after mastectomy with a JP (Jackson-Pratt) drain. Which discharge instruction is MOST important for JP drain management?",
 opts:["Remove the drain when drainage is less than 100 mL/day","Empty the drain and record output 2-3 times daily; report drainage >30 mL/8 hours or signs of infection","Leave the drain site uncovered to allow air circulation","Limit arm movement completely for 6 weeks"], ans:1,
 exp:"JP drain management: empty 2-3 times daily (or when half full), record output, maintain suction by compressing the bulb, and report signs of infection (redness, warmth, purulent drainage, fever). Drains are typically removed when output is <30 mL/24 hours for 2 consecutive days."
},
{id:236,topic:'nursing',source:'CNPP Level',
 q:"Mrs. Nuha Al-Shehri, a 44-year-old woman with locally advanced breast cancer, receives neoadjuvant chemotherapy followed by surgery. The surgeon reports 'no residual invasive cancer in the breast or lymph nodes.' The nurse explains this as:",
 opts:["Tumor shrinks by 50% on imaging after neoadjuvant therapy","No residual invasive cancer in the breast AND lymph nodes at surgery after neoadjuvant therapy","All cancer cells are destroyed by radiation","Complete resolution of symptoms after systemic therapy"], ans:1,
 exp:"pCR is defined as no residual invasive cancer in the breast and lymph nodes at surgical resection (ypT0/is ypN0) after neoadjuvant therapy. It is the strongest predictor of long-term disease-free and overall survival, particularly in TNBC and HER2+ subtypes."
},
{id:237,topic:'treatment',source:'CNPP Level',
 q:"Mrs. Raneem Al-Mutairi, a 29-year-old woman with a BRCA1 mutation and no current breast cancer, asks about surveillance guidelines. The recommended approach for a BRCA1 carrier of her age includes:",
 opts:["Annual mammography starting at age 40, same as average-risk women","Annual mammography AND breast MRI starting at age 25-30, plus clinical breast exam every 6 months","No surveillance until age 40 due to dense breast tissue","CT scan every 6 months"], ans:1,
 exp:"For BRCA1/2 mutation carriers: annual mammography + annual contrast-enhanced breast MRI starting at age 25-30 (or 10 years before youngest affected family member), plus clinical breast exam every 6 months. MRI detects cancers missed by mammography in dense breasts. NCCN Guidelines for Hereditary Breast and Ovarian Cancer."
},
{id:238,topic:'genetics',source:'CNPP Level',
 q:"Mrs. Lama Al-Zahrani, a 55-year-old woman with ER+/HER2− metastatic breast cancer, is started on palbociclib plus letrozole. CDK4/6 inhibitors like palbociclib are used for:",
 opts:["Triple-negative metastatic breast cancer","ER+/HER2- metastatic or high-risk early-stage breast cancer in combination with endocrine therapy","HER2+ metastatic breast cancer with trastuzumab","Any breast cancer with BRCA mutation"], ans:1,
 exp:"CDK4/6 inhibitors are approved for ER+/HER2- advanced/metastatic breast cancer combined with aromatase inhibitors (first-line) or fulvestrant (second-line), significantly improving PFS. Abemaciclib is also approved for high-risk early-stage ER+ breast cancer."
},
{id:239,topic:'treatment',source:'CNPP Level',
 q:"Mrs. Atyaf Al-Qahtani, a 43-year-old woman with germline BRCA2 mutation and HER2-negative metastatic breast cancer, is prescribed olaparib. PARP inhibitors are most appropriate for which breast cancer patient?",
 opts:["Any patient with metastatic TNBC","Patient with germline BRCA1/2 mutation and HER2-negative metastatic breast cancer","Patient with ER+ breast cancer regardless of BRCA status","Any patient who failed anthracycline therapy"], ans:1,
 exp:"PARP inhibitors exploit synthetic lethality — in BRCA-mutated cells, PARP inhibition blocks single-strand break repair, causing lethal double-strand breaks. Approved for germline BRCA1/2-mutated, HER2-negative metastatic breast cancer (OlympiAD, EMBRACA trials)."
},
{id:240,topic:'treatment',source:'CNPP Level',
 q:"Mrs. Ikram Al-Harbi, a 29-year-old woman in her second trimester of pregnancy, is diagnosed with breast cancer. Regarding pregnancy-associated breast cancer (PABC), which statement is TRUE?",
 opts:["Chemotherapy cannot be given during any trimester of pregnancy","Chemotherapy can be safely administered after the first trimester (after organogenesis)","Immediate termination of pregnancy is required for all PABC cases","Radiation therapy is the preferred initial treatment in PABC"], ans:1,
 exp:"After the first trimester (organogenesis is complete), certain chemotherapy regimens (anthracyclines, cyclophosphamide) can be safely administered with acceptable fetal risk. Radiation therapy is avoided during pregnancy. Hormonal therapy and trastuzumab are contraindicated in pregnancy. Surgery is the safest initial treatment at any trimester."
},
{id:241,topic:'diagnosis',source:'CNPP Level',
 q:"Mrs. Shadya Al-Ghamdi, a 42-year-old woman, asks her nurse during a health promotion session about evidence-based lifestyle modifications to reduce breast cancer risk. Which lifestyle modification is evidence-based?",
 opts:["Taking high-dose vitamin supplements","Limiting alcohol consumption to less than 1 drink per day and maintaining healthy weight","Avoiding soy-containing foods entirely","Taking low-dose aspirin daily"], ans:1,
 exp:"Limiting alcohol (alcohol is a known breast cancer carcinogen at even low levels) and maintaining a healthy weight (especially post-menopausal) are the two most evidence-based lifestyle modifications for breast cancer risk reduction. Physical activity (150+ min/week moderate intensity) also reduces risk."
},
{id:242,topic:'risk',source:'CNPP Level',
 q:"Mrs. Wulaa Al-Rashidi, a 36-year-old woman who breastfed her two children for a combined 18 months, asks if this provided any protection against breast cancer. The nurse's best response, based on evidence, is:",
 opts:["Breastfeeding has no proven protective effect against breast cancer","Breastfeeding, especially for longer durations, is associated with reduced breast cancer risk","Only breastfeeding for more than 2 years provides protection","Breastfeeding only protects against BRCA-related breast cancers"], ans:1,
 exp:"Breastfeeding is a proven protective factor — each 12 months of breastfeeding reduces breast cancer risk by ~4.3% (in addition to a ~7% reduction per birth). Protective mechanisms include delayed resumption of menstrual cycles, differentiation of breast cells, and shedding of breast cells. Longer duration confers greater protection."
},
{id:243,topic:'risk',source:'CNPP Level',
 q:"Mrs. Ateelah Al-Dosari, a 49-year-old woman on tamoxifen, reports hot flashes significantly affecting her quality of life. The nurse should FIRST recommend:",
 opts:["Discontinuing tamoxifen — the side effects outweigh the benefits","Non-hormonal interventions: venlafaxine, clonidine, gabapentin, or lifestyle modifications","Estrogen cream to manage vaginal dryness and hot flashes","Switching to an aromatase inhibitor (which has no hot flash side effects)"], ans:1,
 exp:"Estrogen-containing treatments are CONTRAINDICATED in breast cancer patients on tamoxifen. Non-hormonal options include: venlafaxine/desvenlafaxine (SNRIs — most effective), clonidine, gabapentin, and lifestyle modifications (avoid triggers: caffeine, alcohol, hot beverages; use layered clothing; cool environment). AIs also cause hot flashes."
},
{id:244,topic:'nursing',source:'CNPP Level',
 q:"Mrs. Fayrouz Al-Shehri, a 47-year-old woman after axillary lymph node dissection, asks what she can do to prevent lymphedema. The nurse's response should include:",
 opts:["Avoid any arm movement or exercise permanently","Avoid blood pressure measurements and venipuncture in the affected arm, protect from injury, maintain healthy weight, and wear compression garments during strenuous activity","Apply heat packs to the arm to improve circulation","Massage the axillary area vigorously to prevent scarring"], ans:1,
 exp:"Lymphedema prevention education after ALND includes: no blood pressure/venipuncture in affected arm, protect from cuts/burns/insect bites (infection triggers), wear compression during strenuous activity/travel, maintain healthy weight, gentle progressive exercise (not avoidance), and avoid constricting jewelry/clothing. Early detection and treatment are key."
},
{id:245,topic:'nursing',source:'CNPP Level',
 q:"Mrs. Firdos Al-Mutairi, a 45-year-old woman with HER2+ breast cancer, is receiving pertuzumab with trastuzumab. She asks why she needs two HER2-targeted drugs. Pertuzumab is used in combination with trastuzumab because it:",
 opts:["Reduces the cardiotoxicity of trastuzumab","Treats ER+ component simultaneously","Binds to a different epitope of HER2 (domain II), preventing HER2 dimerization and enhancing anti-tumor efficacy","Reverses trastuzumab resistance"], ans:2,
 exp:"Pertuzumab binds to HER2 domain II (while trastuzumab binds domain IV), preventing HER2 dimerization with other HER receptors. This dual HER2 blockade significantly improves outcomes. The CLEOPATRA trial (pertuzumab + trastuzumab + docetaxel) showed improved PFS and OS in HER2+ metastatic BC."
},
{id:246,topic:'treatment',source:'CNPP Level',
 q:"Mrs. Shahad Al-Zahrani, a 51-year-old woman with bone metastases from breast cancer, is started on denosumab. The nurse explains how this medication works. Denosumab works by:",
 opts:["Killing cancer cells in the bone","Blocking the RANK-L signaling pathway, reducing osteoclast activity and preventing skeletal-related events","Replacing calcium lost from bones","Stimulating bone marrow to produce more blood cells"], ans:1,
 exp:"Denosumab is a RANK-L inhibitor that blocks osteoclast formation and activity, preventing pathologic bone resorption caused by metastases. It reduces skeletal-related events (SREs): fractures, spinal cord compression, hypercalcemia, need for bone radiation/surgery. Side effects include osteonecrosis of the jaw (ONJ) and hypocalcemia."
},
{id:247,topic:'treatment',source:'CNPP Level',
 q:"Mrs. Lubna Al-Qahtani, a 48-year-old woman, receives a mammogram report stating 'BI-RADS category 3.' The nurse explains this means:",
 opts:["Malignancy confirmed — surgery scheduled","Probably benign — 6-month follow-up mammogram recommended (malignancy risk <2%)","Highly suspicious — biopsy required urgently","Normal — return in 1 year"], ans:1,
 exp:"BI-RADS 3 = probably benign finding with <2% risk of malignancy. Recommended management is 6-month short-interval follow-up imaging (not immediate biopsy). BI-RADS scale: 0=incomplete, 1=negative, 2=benign, 3=probably benign, 4=suspicious, 5=highly suggestive of malignancy, 6=biopsy-proven malignancy."
},
{id:248,topic:'diagnosis',source:'CNPP Level',
 q:"Mrs. Hana Al-Harbi, a 46-year-old woman with ER+ breast cancer, asks the nurse why she needs to take an endocrine therapy pill for 5–10 years after completing all her other treatment. The best explanation is:",
 opts:["It kills any remaining cancer cells that surgery missed","It blocks estrogen signaling or reduces estrogen levels to prevent remaining microscopic cancer cells from growing and reduce recurrence risk","It rebuilds the immune system after chemotherapy","It prevents development of new primary cancers in the opposite breast only"], ans:1,
 exp:"Adjuvant endocrine therapy (tamoxifen or aromatase inhibitors) reduces recurrence risk by 30-50% in ER+ breast cancer. Mechanisms: tamoxifen blocks estrogen receptors; AIs reduce estrogen production. Duration: 5-10 years. It targets the micrometastatic residual disease that cannot be surgically removed or detected."
},
{id:249,topic:'treatment',source:'CNPP Level',
 q:"Mrs. Soad Al-Ghamdi, a 50-year-old woman newly diagnosed with breast cancer, breaks down crying and says, 'I just need to know if I'm going to die.' The therapeutic nursing response is:",
 opts:["Reassure her with survival statistics immediately","Give her a brochure about breast cancer outcomes","Acknowledge her fear, sit with her, and ask what specific concerns are causing the most distress","Immediately call the physician to address her prognosis"], ans:2,
 exp:"Therapeutic communication prioritizes acknowledgment of feelings before information giving. Saying 'I can hear how frightened you are' and asking 'What are you most worried about?' opens the conversation, identifies specific concerns, and builds trust. Immediately providing statistics can dismiss feelings."
},
{id:250,topic:'nursing',source:'CNPP Level',
 q:"Mrs. Aisha Al-Rashidi, a 48-year-old woman with metastatic TNBC who has failed 2 prior therapies, is prescribed sacituzumab govitecan (Trodelvy). Sacituzumab govitecan is indicated for:",
 opts:["ER+ HER2- early-stage breast cancer after surgery","Unresectable locally advanced or metastatic TNBC after 2 or more prior systemic therapies","HER2+ metastatic breast cancer with prior trastuzumab","BRCA-mutated ER+ metastatic BC"], ans:1,
 exp:"Sacituzumab govitecan (anti-Trop-2 ADC delivering SN-38) is approved for unresectable locally advanced or metastatic TNBC after ≥2 prior therapies (ASCENT trial: improved PFS 5.6 vs 1.7 months, OS 12.1 vs 6.7 months). It is also being studied in ER+ HER2- breast cancer."
},
{id:251,topic:'treatment',source:'CNPP Level',
 q:"Mrs. Norah Al-Dosari, a 47-year-old woman, reviews her pathology report showing ER+/PR+, HER2-negative, Ki-67 8%. The oncologist says she has the most favorable molecular subtype. Which subtype is this?",
 opts:["Triple-negative","HER2-enriched","Luminal A","Luminal B"], ans:2,
 exp:"Luminal A characteristics: ER+/PR+, HER2-negative, LOW Ki-67 (<14-20%), low grade. It is the most common subtype (~50%), has the best prognosis, responds well to endocrine therapy, and typically does NOT require chemotherapy."
},
{id:252,topic:'diagnosis',source:'CNPP Level',
 q:"Mrs. Mahasen Al-Shehri, a 53-year-old woman undergoing chest wall radiation after mastectomy, develops Grade 2 radiation dermatitis. The nurse should:",
 opts:["Apply petroleum jelly (Vaseline) and continue treatment unchanged","Cleanse gently with mild soap and water, apply prescribed moisture barrier cream, avoid tight clothing, and notify the radiation team","Apply talcum powder to keep the area dry","Stop radiation therapy and notify the oncologist of treatment failure"], ans:1,
 exp:"Grade 2 radiation dermatitis management: gentle cleansing with mild soap, prescribed moisture barrier cream (not petroleum jelly), avoid friction/heat/sun, wear loose cotton clothing. Avoid: deodorants/antiperspirants, talcum powder, razors in radiation field. Notify radiation team for severe reactions (Grade 3-4 moist desquamation)."
},
{id:253,topic:'nursing',source:'CNPP Level',
 q:"Mrs. Shoug Al-Mutairi, a 45-year-old woman with inflammatory breast cancer (IBC), asks about her treatment plan. Which of the following is TRUE regarding IBC management?",
 opts:["Surgery is the first treatment for IBC","IBC is always treated with mastectomy alone without systemic therapy","IBC requires neoadjuvant chemotherapy BEFORE surgery, followed by mastectomy and radiation","IBC has a better prognosis than other breast cancer types"], ans:2,
 exp:"IBC management: neoadjuvant chemotherapy is ALWAYS given first, followed by modified radical mastectomy (BCT is contraindicated), then post-mastectomy radiation. If HER2+, add anti-HER2 therapy. IBC has a worse prognosis (5-year survival ~40%) due to aggressive biology and rapid progression."
},
{id:254,topic:'treatment',source:'CNPP Level',
 q:"Mrs. Amani Al-Zahrani, a 32-year-old woman completing chemotherapy for breast cancer, tells the nurse she wants children in the future and is worried about her fertility. The nurse's BEST response is:",
 opts:["Fertility is not affected by chemotherapy, so no special action is needed","All women who receive chemotherapy become permanently infertile","Chemotherapy can cause premature ovarian insufficiency — fertility preservation should be discussed BEFORE starting chemotherapy","Pregnancy is absolutely contraindicated for 10 years after breast cancer treatment"], ans:2,
 exp:"Chemotherapy (especially alkylating agents like cyclophosphamide) can cause premature ovarian insufficiency and infertility. Fertility preservation (embryo cryopreservation, oocyte cryopreservation) should be discussed with a reproductive endocrinologist BEFORE starting chemotherapy for the best outcomes."
},
{id:255,topic:'nursing',source:'CNPP Level',
 q:"Mrs. Hajer Al-Qahtani, a 47-year-old woman with locally advanced breast cancer, has a PET-CT scan ordered. The nurse explains the purpose of PET scanning in breast cancer. A PET scan is used to:",
 opts:["Determine exact tumor size for surgical planning","Assess for distant metastatic disease and evaluate treatment response at the whole-body level","Replace mammography for diagnosis","Measure hormone receptor levels"], ans:1,
 exp:"PET (Positron Emission Tomography) with FDG detects metabolically active cancer cells. In breast cancer, it is used to: (1) evaluate for distant metastases in locally advanced disease, (2) assess treatment response, and (3) investigate suspected recurrence. It is NOT used for initial diagnosis or routine early-stage staging."
},
{id:256,topic:'diagnosis',source:'CNPP Level',
 q:"Mrs. Nisreen Al-Harbi, a 54-year-old woman with stage II ER+ breast cancer, has completed 5 years of tamoxifen. Her oncologist discusses extended endocrine therapy. Extended therapy (7–10 years) is considered for:",
 opts:["All ER+ patients regardless of stage","Higher-risk patients: node-positive disease, large tumors, high grade","Only pre-menopausal patients","Patients who also received trastuzumab"], ans:1,
 exp:"Extended endocrine therapy (7-10 years) beyond initial 5 years reduces late recurrence risk in higher-risk ER+ patients (node-positive, large primary tumor, high grade). The MA.17 trial (letrozole after 5 years tamoxifen) and ATLAS trial (extended tamoxifen) demonstrated continued risk reduction."
},
{id:257,topic:'treatment',source:'CNPP Level',
 q:"Mrs. Wardah Al-Ghamdi, a 55-year-old woman with bone metastases, suddenly develops severe back pain and leg weakness while walking in the corridor. The nurse's PRIORITY action is:",
 opts:["Administer scheduled pain medication and reassess in 4 hours","Immediately notify the physician — this presentation suggests spinal cord compression, a neurological emergency","Apply a heating pad to the lumbar area","Assist the patient to ambulate to strengthen muscle weakness"], ans:1,
 exp:"Sudden back pain + leg weakness in a patient with bone metastases = spinal cord compression until proven otherwise — a MEDICAL EMERGENCY. Immediate actions: notify physician, maintain spinal precautions, IV dexamethasone, urgent MRI spine, radiation/surgical oncology consultation. Do NOT ambulate."
},
{id:258,topic:'nursing',source:'CNPP Level',
 q:"Mrs. Bayan Al-Rashidi, a 46-year-old woman, had a prior biopsy showing atypical ductal hyperplasia (ADH). She asks the nurse what this finding means for her cancer risk. The nurse explains:",
 opts:["She has early breast cancer and needs surgery","ADH is a benign condition with no increased cancer risk","ADH increases her risk of developing breast cancer by 4-5 times compared to the general population","ADH means she definitely has a BRCA mutation"], ans:2,
 exp:"ADH (atypical ductal hyperplasia) is a high-risk benign breast lesion — NOT cancer — but it significantly increases relative breast cancer risk by 4-5 times. Combined with family history, risk is ~10 times. Management includes increased surveillance and may include chemoprevention."
},
{id:259,topic:'risk',source:'CNPP Level',
 q:"Mrs. Rind Al-Dosari, a 42-year-old woman with high-risk early-stage TNBC, is started on pembrolizumab plus neoadjuvant chemotherapy. She asks the nurse why she needs immunotherapy. Pembrolizumab is approved in breast cancer for:",
 opts:["All metastatic breast cancer regardless of subtype","ER+ HER2- metastatic breast cancer","High-risk early-stage TNBC (neoadjuvant + adjuvant) and metastatic TNBC with PD-L1+ (CPS ≥10)","HER2+ metastatic breast cancer failing two prior HER2-directed therapies"], ans:2,
 exp:"Pembrolizumab (anti-PD-1) is approved for: (1) high-risk early-stage TNBC — neoadjuvant pembrolizumab + chemotherapy, then adjuvant pembrolizumab (KEYNOTE-522), and (2) PD-L1+ (CPS ≥10) metastatic TNBC in combination with chemotherapy (KEYNOTE-355)."
},
{id:260,topic:'treatment',source:'CNPP Level',
 q:"Mrs. Hala Al-Shehri, a 45-year-old woman with ER+ breast cancer, tells the nurse she has been reading about high-dose antioxidant supplements that claim to 'boost immunity during chemotherapy.' The nurse's best response is:",
 opts:["Encourage all complementary therapies as they can only help","High-dose antioxidants may theoretically reduce chemotherapy efficacy by protecting cancer cells from oxidative damage — discuss with the oncology team before taking","All supplements are safe if purchased from health food stores","Antioxidants will significantly improve treatment outcomes"], ans:1,
 exp:"High-dose antioxidant supplements during chemotherapy are controversial — they may theoretically protect cancer cells from oxidative stress that many chemotherapy agents use to kill cancer. Patients should discuss ALL supplements with their oncology team before taking them."
},
{id:261,topic:'nursing',source:'CNPP Level',
 q:"Mrs. Nora Al-Mutairi, a 51-year-old woman completing treatment for breast cancer, asks about her survivorship care plan. The nurse explains that a survivorship care plan includes:",
 opts:["Only future mammography schedules","A comprehensive summary of treatment received, ongoing surveillance schedule, management of late effects, and health promotion recommendations","Insurance and financial assistance information only","A plan for end-of-life care"], ans:1,
 exp:"A survivorship care plan (SCP) includes: (1) treatment summary, (2) surveillance/follow-up schedule, (3) management of late and long-term effects, (4) health promotion (exercise, diet, smoking cessation), and (5) coordination of care between oncology and primary care."
},
{id:262,topic:'nursing',source:'CNPP Level',
 q:"Mrs. Farida Al-Zahrani, a 56-year-old woman with metastatic breast cancer, has CA 15-3 levels monitored at every visit. She asks the nurse why. The nurse explains that CA 15-3 and CA 27.29 are primarily used for:",
 opts:["Screening in average-risk women","Diagnosing early-stage breast cancer","Monitoring treatment response in metastatic disease","Determining hormone receptor status"], ans:2,

qs2.forEach(q => { q.bluebook = true; });

const questions = [...qs1, ...qs2];

let answered={}, showAnswers=false, currentFilter='all';

function getCardClass(q){
  let cls = 'q-card';
  if(q.bluebook) cls += ' blue-book';
  else if(q.book) cls += ' book-q';
  return cls;
}

function render(){
  const container = document.getElementById('q-container');
  container.innerHTML = '';
  const visible = getVisible();
  document.getElementById('total-count').textContent = visible.length;

  questions.forEach(q => {
    const isVis = visible.includes(q);
    const div = document.createElement('div');
    div.className = getCardClass(q) + (isVis ? '' : ' hidden');
    div.id = 'q' + q.id;
    const isAns = answered[q.id] !== undefined;
    const userAns = answered[q.id];
    const correct = userAns === q.ans;
    const srcBadge = q.bluebook
      ? '<span class="src-badge blue">📘 Blue Book (CNPP 8th Ed)</span>'
      : (q.book ? '<span class="src-badge rose">📖 From Book</span>' : '');
    div.innerHTML = `
      <div class="q-header">
        <div class="q-num">${q.id}</div>
        <div style="flex:1">
          <div class="q-topic">${q.topic.toUpperCase()}${q.book||q.bluebook?' 📘':''}</div>
          <div class="q-text">${q.q}</div>
        </div>
        <div class="q-status ${isAns?(correct?'correct':'wrong'):''}">${isAns?(correct?'✓':'✗'):''}</div>
      </div>
      <div class="q-body">
        ${srcBadge}
        <div class="q-source">${q.source||''}</div>
        <div class="options" id="opts${q.id}">
          ${q.opts.map((opt,i)=>{
            let cls='opt';
            if(isAns||showAnswers){cls+=' disabled';if(i===q.ans)cls+=' correct';else if(isAns&&i===userAns&&userAns!==q.ans)cls+=' selected-wrong';}
            return `<div class="${cls}" onclick="selectAnswer(${q.id},${i})"><div class="opt-letter">${['A','B','C','D'][i]}</div><div>${opt}</div></div>`;
          }).join('')}
        </div>
        <div class="explanation ${(isAns||showAnswers)?'show':''}" id="exp${q.id}"><strong>💡 Explanation:</strong>${q.exp||''}</div>
      </div>`;
    container.appendChild(div);
  });
  updateProgress(); updateScore(); checkSubmit();
}

function selectAnswer(qid, optIdx){
  if(answered[qid]!==undefined||showAnswers) return;
  answered[qid] = optIdx;
  const q = questions.find(x=>x.id===qid);
  document.querySelectorAll(`#opts${qid} .opt`).forEach((el,i)=>{
    el.classList.add('disabled');
    if(i===q.ans) el.classList.add('correct');
    else if(i===optIdx&&optIdx!==q.ans) el.classList.add('selected-wrong');
  });
  document.getElementById('exp'+qid).classList.add('show');
  const s = document.querySelector(`#q${qid} .q-status`);
  s.className = 'q-status '+(optIdx===q.ans?'correct':'wrong');
  s.textContent = optIdx===q.ans?'✓':'✗';
  updateProgress(); updateScore(); checkSubmit();
}

function getVisible(){
  if(currentFilter==='all') return questions;
  if(currentFilter==='bluebook') return questions.filter(q=>q.bluebook);
  if(currentFilter==='book') return questions.filter(q=>q.book);
  return questions.filter(q=>q.topic===currentFilter);
}

function updateProgress(){
  const vis = getVisible();
  const cnt = vis.filter(q=>answered[q.id]!==undefined).length;
  document.getElementById('progress-fill').style.width = (vis.length>0?cnt/vis.length*100:0)+'%';
  document.getElementById('answered-count').textContent = cnt;
}

function updateScore(){
  const vis = getVisible();
  const ans = vis.filter(q=>answered[q.id]!==undefined);
  const cor = ans.filter(q=>answered[q.id]===q.ans).length;
  document.getElementById('score-val').textContent = cor;
  document.getElementById('total-answered').textContent = ans.length;
}

function checkSubmit(){
  const vis = getVisible();
  const all = vis.length>0 && vis.every(q=>answered[q.id]!==undefined);
  document.getElementById('submit-all').classList.toggle('show', all);
}

function filterBy(f, btn){
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function shuffleQuestions(){
  for(let i=questions.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [questions[i],questions[j]]=[questions[j],questions[i]];
  }
  render();
}

function toggleShowAnswers(){
  showAnswers = !showAnswers;
  document.getElementById('btn-show-all').classList.toggle('active',showAnswers);
  document.getElementById('btn-show-all').textContent = showAnswers?'🙈 Hide':'👁 Show Answers';
  render();
}

function resetQuiz(){
  answered = {}; showAnswers = false;
  document.getElementById('btn-show-all').classList.remove('active');
  document.getElementById('btn-show-all').textContent = '👁 Show Answers';
  document.getElementById('results-modal').classList.remove('show');
  render();
}

function submitQuiz(){
  const vis = getVisible();
  const cor = vis.filter(q=>answered[q.id]===q.ans).length;
  const tot = vis.length;
  const pct = Math.round(cor/tot*100);
  document.getElementById('final-score').textContent = cor;
  document.getElementById('final-pct').textContent = 'out of '+tot+' questions';

  // By source stats
  const qs1v = vis.filter(q=>!q.bluebook);
  const qs2v = vis.filter(q=>q.bluebook);
  const cor1 = qs1v.filter(q=>answered[q.id]===q.ans).length;
  const cor2 = qs2v.filter(q=>answered[q.id]===q.ans).length;
  const statsHtml = qs1v.length&&qs2v.length ? `
    <div class="stat-box"><div class="n">${cor1}/${qs1v.length}</div><div class="l">General</div></div>
    <div class="stat-box blue"><div class="n">${cor2}/${qs2v.length}</div><div class="l">Blue Book</div></div>` : '';
  document.getElementById('stats-row').innerHTML = statsHtml;

  let grade,msg,color;
  if(pct>=90){grade='Excellent 🏆';color='#16a34a';msg='Outstanding! You are ready for the SCFHS exam.';}
  else if(pct>=80){grade='Very Good ⭐';color='#2563eb';msg='Great performance! Review the questions you missed.';}
  else if(pct>=70){grade='Good 👍';color='#d97706';msg='Good effort. Focus on weak topics and retry.';}
  else if(pct>=60){grade='Pass ✓';color='#ea580c';msg='You passed. More review needed on weak areas.';}
  else{grade='Needs Work 📚';color='#dc2626';msg='Keep studying! Review the Blue Book and try again.';}

  const g = document.getElementById('final-grade');
  g.textContent = grade+' — '+pct+'%'; g.style.background=color+'20'; g.style.color=color;
  document.getElementById('final-msg').textContent = msg;
  document.getElementById('results-modal').classList.add('show');
}

function closeResults(){
  document.getElementById('results-modal').classList.remove('show');
  window.scrollTo(0,0);
}

render();
</script>
