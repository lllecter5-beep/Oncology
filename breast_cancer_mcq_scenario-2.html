<head>

<title>Breast Cancer MCQ — Complete Bank (168 Questions)</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root{--rose:#be185d;--rose-dim:#fce7f3;--rose-dark:#831843;--navy:#1e3a8a;--green:#16a34a;--red:#dc2626;--gold:#d97706;--blue:#2563eb;--bg:#f5f7fa;--surface:#fff;--border:#e2e8f0;--text:#1e293b;--muted:#64748b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:linear-gradient(135deg,#3b0a24,#831843 40%,#be185d 70%,#1e3a8a);padding:28px 20px 24px;text-align:center;color:#fff}
.header h1{font-family:'Playfair Display',serif;font-size:1.7em;margin-bottom:6px}
.header p{font-size:.82em;color:#fce7f3;opacity:.9}
.badges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.badge{display:inline-block;padding:3px 12px;border-radius:20px;font-size:.72em;font-weight:700}
.badge-rose{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);color:#fff}
.badge-blue{background:rgba(30,58,138,.4);border:1px solid rgba(147,197,253,.4);color:#bfdbfe}
.controls{background:#fff;border-bottom:1px solid var(--border);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.ctrl-btn{padding:7px 14px;border-radius:20px;border:1.5px solid var(--border);background:#fff;color:var(--muted);font-size:.78em;font-weight:600;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent}
.ctrl-btn.active{background:var(--rose);color:#fff;border-color:var(--rose)}
#score-bar{background:var(--rose-dim);border-radius:20px;padding:6px 14px;font-size:.78em;font-weight:700;color:var(--rose-dark)}
.filter-bar{padding:10px 16px;background:#fff;border-bottom:1px solid var(--border);display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.filter-btn{padding:5px 12px;border-radius:20px;border:1.5px solid var(--border);background:#fff;color:var(--muted);font-size:.73em;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s}
.filter-btn.active{border-color:var(--rose);background:var(--rose-dim);color:var(--rose)}
.filter-btn.blue-filter.active{border-color:var(--blue);background:#eff6ff;color:var(--blue)}
.progress-wrap{padding:12px 16px 0}
.progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--rose),var(--blue));border-radius:3px;transition:width .4s}
.progress-text{font-size:.73em;color:var(--muted);margin-top:4px;text-align:right}
.q-container{padding:12px 16px 80px;max-width:820px;margin:0 auto}
.q-card{background:#fff;border:1px solid var(--border);border-radius:14px;margin-bottom:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.q-card.book-q{border-left:4px solid var(--blue)}
.q-card.blue-book{border-left:4px solid var(--navy)}
.q-header{display:flex;align-items:flex-start;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--border)}
.q-num{background:var(--rose);color:#fff;border-radius:8px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:.73em;font-weight:700;flex-shrink:0;margin-top:1px}
.q-card.book-q .q-num{background:var(--rose-dark)}
.q-card.blue-book .q-num{background:var(--navy)}
.q-topic{font-size:.67em;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--rose);margin-bottom:4px}
.q-card.blue-book .q-topic{color:var(--navy)}
.q-text{font-size:.9em;line-height:1.6;font-weight:600;color:var(--text)}
.q-body{padding:12px 16px}
.q-source{font-size:.68em;color:var(--muted);margin-bottom:10px;font-style:italic}
.src-badge{display:inline-block;border-radius:8px;padding:2px 8px;font-size:.68em;font-weight:700;margin-bottom:8px}
.src-badge.rose{background:var(--rose-dim);color:var(--rose)}
.src-badge.blue{background:#eff6ff;color:#1d4ed8}
.options{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;font-size:.87em;line-height:1.5}
.opt:hover{border-color:var(--rose);background:var(--rose-dim)}
.opt-letter{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.7em;font-weight:700;flex-shrink:0;color:var(--muted)}
.opt.correct{background:#dcfce7;border-color:var(--green)}
.opt.correct .opt-letter{background:var(--green);color:#fff;border-color:var(--green)}
.opt.selected-wrong{background:#fee2e2;border-color:var(--red)}
.opt.selected-wrong .opt-letter{background:var(--red);color:#fff;border-color:var(--red)}
.opt.disabled{cursor:default;pointer-events:none}
.explanation{margin-top:12px;padding:12px 14px;border-radius:10px;background:#f0f9ff;border-left:3px solid var(--blue);font-size:.83em;line-height:1.6;color:#1e3a8a;display:none}
.explanation.show{display:block}
.explanation strong{display:block;margin-bottom:4px}
.q-status{display:none;font-size:.7em;font-weight:700;padding:2px 8px;border-radius:10px;margin-left:auto;flex-shrink:0}
.q-status.correct{background:#dcfce7;color:var(--green);display:block}
.q-status.wrong{background:#fee2e2;color:var(--red);display:block}
#results-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;display:none;align-items:center;justify-content:center;padding:20px}
#results-modal.show{display:flex}
.results-box{background:#fff;border-radius:20px;padding:32px 24px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.results-score{font-size:3.5em;font-weight:700;color:var(--rose);font-family:'Playfair Display',serif;line-height:1}
.results-pct{font-size:1.1em;color:var(--muted);margin-top:4px}
.results-grade{font-size:1.3em;font-weight:700;margin:12px 0;padding:8px 20px;border-radius:12px;display:inline-block}
.results-msg{font-size:.88em;color:var(--text);margin:12px 0;line-height:1.6}
.results-btn{background:var(--rose);color:#fff;border:none;border-radius:12px;padding:12px 28px;font-size:.9em;font-weight:700;cursor:pointer;margin-top:12px;width:100%}
#submit-all{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--rose);color:#fff;border:none;border-radius:30px;padding:14px 32px;font-size:.9em;font-weight:700;cursor:pointer;box-shadow:0 4px 20px rgba(190,24,93,.4);z-index:500;display:none}
#submit-all.show{display:block}
.q-card.hidden{display:none}
.stats-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.stat-box{background:var(--rose-dim);border-radius:10px;padding:8px 16px;text-align:center;min-width:70px}
.stat-box .n{font-size:1.4em;font-weight:700;color:var(--rose);line-height:1}
.stat-box .l{font-size:.68em;color:var(--muted);margin-top:2px}
.stat-box.blue{background:#eff6ff}
.stat-box.blue .n{color:var(--blue)}
</style>
</head>

<div class="header">

    <div class="results-grade" id="final-grade"></div>
    <div class="results-msg" id="final-msg"></div>
    <div class="stats-row" id="stats-row"></div>
    <button class="results-btn" onclick="closeResults()">Review Answers</button>
    <button class="results-btn" style="background:var(--navy);margin-top:8px" onclick="resetQuiz()">Try Again</button>
  </div>

<script>

// ── FILE 1 QUESTIONS (93) ──
const qs1 = [
{id:1,topic:'risk',book:true,source:'Book Q1',
 q:"Mrs. Nora Al-Qahtani, a 58-year-old Saudi woman, comes to the oncology clinic for a breast cancer risk assessment. The nurse explains that there are multiple risk factors, but two are considered most important. Along with age, which one of the following is the other most important risk factor?",
 opts:["Gender","Race","Reproductive/hormonal factors","Pregnancy"], ans:0,
 exp:"Answer A. There are multiple risk factors for developing breast cancer. Breast cancer is 100 times more common in women than men. The incidence is higher with aging — only 5% before age 40 develop BC, but 60% of cases occur after age 60. A person's family history also increases risk. Approximately 10% of all breast cancers are due to genetic susceptibility. CNPP Ch.13."
},
{id:2,topic:'genetics',book:true,source:'Book Q2',
 q:"Ms. Rima Al-Dosari, a 42-year-old woman, is being evaluated for possible hereditary breast cancer. The nurse reviews her history to determine which factor would MOST likely indicate a genetic abnormality. Which one of the following factors makes a patient more likely to have a genetic abnormality based on family history of breast cancer?",
 opts:["History of multiple breast surgeries","First-degree relative with breast cancer","Age of menopause or menarche prior to diagnosis","Nulliparity"], ans:1,
 exp:"Having a first-degree relative (mother, sister, daughter) with breast cancer significantly increases the likelihood of carrying a hereditary gene mutation such as BRCA1/2."
},
{id:3,topic:'genetics',book:true,source:'Book Q3',
 q:"Four patients present to the oncology genetics clinic. The nurse must determine which patient should be prioritized for genetic mutation testing. Which one of the following patients should undergo genetic testing for mutation?",
 opts:["A 60-year-old male with breast cancer","An 80-year-old female with grade 1, ER/PR-positive breast cancer","A 55-year-old female with ductal carcinoma in situ (DCIS)","A 60-year-old female who is post-menopausal with no family history"], ans:0,
 exp:"All men diagnosed with breast cancer should undergo multigene genetic testing (NCCN guidelines), as male breast cancer is strongly associated with BRCA2 mutations."
},
{id:4,topic:'treatment',book:true,source:'Book Q4',
 q:"Mrs. Fatima Al-Shehri, a 54-year-old post-menopausal Saudi woman with a strong family history of breast cancer, asks her oncology nurse about approved agents for primary prevention. Which of the following approved agents could be utilized for the primary prevention of breast cancer in high-risk post-menopausal women?",
 opts:["Retinoids","Metformin","Aromatase inhibitors","Cox-2 inhibitors"], ans:2,
 exp:"Aromatase inhibitors (e.g., exemestane, anastrozole) are approved for chemoprevention in high-risk post-menopausal women. They reduce estrogen production and have been shown to significantly decrease breast cancer incidence."
},
{id:5,topic:'pathology',book:true,source:'Book Q5',
 q:"Ms. Dalal Al-Mutairi, a 48-year-old woman, is recently diagnosed with breast cancer. Her pathology report shows ER-negative, PR-negative, HER2-negative findings. The oncologist explains that her tumor type is suggestive of poor prognosis. Which type of breast cancer is suggestive of poor prognosis?",
 opts:["ER-positive, PR-positive invasive ductal carcinoma","ER-positive, PR-positive invasive lobular carcinoma","ER-negative, PR-negative, Her-2/Neu-negative breast cancer","T4 tumor between 5 and 10 cm with no lymph nodes positive"], ans:2,
 exp:"Triple-negative breast cancer (ER−, PR−, HER2−) has the worst prognosis among breast cancer subtypes. It lacks hormone receptor targets, making it unresponsive to hormonal therapy, and tends to be more aggressive."
},
{id:6,topic:'treatment',book:true,source:'Book Q6',
 q:"K.S. is a 54-year-old female with breast cancer and multiple brain metastases who is scheduled to initiate whole-brain radiation therapy (WBRT). The oncology nurse understands the best description of this treatment's intent is which one of the following?",
 opts:["Palliative","Curative","Adjuvant","Neoadjuvant"], ans:0,
 exp:"WBRT for multiple brain metastases is palliative in intent. It aims to control symptoms and improve quality of life, not to cure the disease. Curative intent applies to early-stage localized disease."
},
{id:7,topic:'treatment',book:true,source:'Book Q7',
 q:"D.P. is a 48-year-old woman who was treated 2 years ago for HER2-positive breast cancer with an anthracycline, taxane, and trastuzumab for 1 year. She calls the clinic stating she is short of breath. Her oncology team is concerned about which one of the following?",
 opts:["Brain and liver metastasis","Lung metastasis and cardiac failure","Liver and lung metastasis","Brain and lung metastasis"], ans:1,
 exp:"Trastuzumab (Herceptin) is associated with cardiotoxicity, and anthracyclines also carry cardiac risk. Shortness of breath in this patient raises concern for cardiac failure. Additionally, lung is a common site for breast cancer metastasis."
},
{id:8,topic:'diagnosis',book:true,source:'Book Q8',
 q:"Mrs. Hayat Al-Zahrani, a 50-year-old woman, presents with a palpable breast mass. The surgeon tells the nurse he needs to order a diagnostic study to confirm the diagnosis of breast cancer. Which diagnostic measure is used specifically to CONFIRM the diagnosis of breast cancer?",
 opts:["Mammography","Breast MRI","Core needle biopsy","Whole-breast ultrasound"], ans:2,
 exp:"Core needle biopsy is the definitive diagnostic tool for breast cancer — it provides tissue for histologic analysis. Mammography, MRI, and ultrasound are imaging tools used for detection and characterization, but biopsy confirms diagnosis."
},
{id:9,topic:'nursing',book:true,source:'Book Q9',
 q:"W.J. is a 56-year-old woman who just had a mastectomy and was found to have had a positive lymph node. Which one of the following educational points should the nurse perform on the patient's first post-operative visit?",
 opts:["Avoid injury and trauma to the affected arm","Avoid upper extremity exercise","Take temperature and report a temperature of more than 100°F","Reduce sodium intake to less than 1800 mg daily"], ans:0,
 exp:"After axillary lymph node dissection, patients are at risk for lymphedema. The priority education is to avoid injury, trauma, blood pressure measurement, and venipuncture on the affected arm to reduce lymphedema risk."
},
{id:10,topic:'staging',book:true,source:'Book Q10',
 q:"S.L. is a 67-year-old woman with stage I ER/PR-positive breast cancer and family history of breast, ovarian, and pancreatic cancer. She has an Oncotype DX test showing a risk score of 24. The nurse responds with which one of the following statements?",
 opts:["No risk of recurrence","Low risk of recurrence","Intermediate risk of recurrence","High risk of recurrence"], ans:2,
 exp:"Oncotype DX recurrence score: Low risk <18, Intermediate risk 18–30, High risk >30. A score of 24 falls in the intermediate risk category, indicating uncertain benefit from chemotherapy."
},
{id:11,topic:'risk',book:true,source:'Book Q11',
 q:"The oncology nurse is comparing breast cancer risk among four patients. T.K. is a 27-year-old white woman; J.L. is a 30-year-old Hispanic woman; D.C. is a 25-year-old white male; and B.R. is a 37-year-old African American woman. Which one of the following patients is MOST likely to develop breast cancer during their lifetime?",
 opts:["T.K., who is a 27-year-old white woman","J.L., who is a 30-year-old Hispanic woman","D.C., who is a 25-year-old white male","B.R., who is a 37-year-old African American woman"], ans:3,
 exp:"Answer A. T.K., a 27-year-old white woman, has a 1 in 8 lifetime risk. J.L., who is Hispanic, has a lower rate than other races. Breast cancer is 100 more times likely in women than men, so D.C. (male) has the smallest chance of the four choices. Finally, B.R., a 37-year-old African American woman, has a 1 in 10 chance of developing cancer. However, more African American women are diagnosed with breast cancer before the age of 45. CNPP Ch.13."
},
{id:12,topic:'pathology',book:true,source:'Book Q12',
 q:"A nursing student asks the preceptor where breast milk is produced in the breast tissue. The preceptor explains the anatomy of the breast. Breast milk is produced by which one of the following?",
 opts:["Terminal duct lobular units","Adipose tissue","Sebaceous tissue","Primary duct units"], ans:0,
 exp:"Milk is produced in the terminal duct lobular units (TDLUs), which consist of acini (milk-producing glands) and terminal ducts. TDLUs are also the site of origin for most breast cancers."
},
{id:13,topic:'genetics',book:true,source:'Book Q13',
 q:"Mrs. Mona Al-Harbi, a 38-year-old woman, underwent genetic testing and was found to have a CDH1 gene mutation. The genetic counselor explains the associated cancer risks. Which one of the following mutations is associated with a hereditary risk for developing LOBULAR breast cancer?",
 opts:["MUTYH","BRCA2","CDH1","PMS2"], ans:2,
 exp:"CDH1 gene mutations cause hereditary diffuse gastric cancer syndrome and are also associated with lobular breast cancer. BRCA1/2 are associated with ductal and overall breast cancer risk."
},
{id:14,topic:'pathology',book:true,source:'Book Q14',
 q:"Mrs. Rasha Al-Otaibi, a 44-year-old woman, is diagnosed with breast cancer. Her pathology shows ER+/PR+, HER2-negative, low Ki-67, and low grade. Her oncologist tells her she has the most favorable breast cancer subtype. Which one of the following is true about Luminal A tumors?",
 opts:["Luminal A tumors have the highest levels of ER expression: ER positive and/or PR-positive","Luminal A tumors tend to be high grade","Luminal A tumors seldom respond to endocrine therapy","Luminal A tumors have a poor prognosis"], ans:0,
 exp:"Luminal A breast cancer is characterized by high ER/PR expression, low HER2, low Ki-67, low grade, and excellent prognosis. It responds very well to endocrine (hormonal) therapy."
},
{id:15,topic:'pathology',book:true,source:'Book Q15',
 q:"A newly hired oncology nurse is reviewing pathology reports. She asks her preceptor to explain histologic grading using the Bloom-Richardson (Nottingham) system. Which statement correctly reflects this histologic classification for Grade 1 tumors?",
 opts:["Grade 1 - low grade and poorly differentiated","Grade 1 - low grade and well differentiated","Grade 1 - high grade and well differentiated","Grade 1 - high grade and poorly differentiated"], ans:1,
 exp:"Bloom-Richardson grading: Grade 1 = low grade, well differentiated (best prognosis); Grade 2 = intermediate; Grade 3 = high grade, poorly differentiated (worst prognosis)."
},
{id:23,topic:'risk',source:'Risk Factors',
 q:"During a community breast cancer awareness session, Mrs. Layla Al-Ghamdi asks the nurse: 'If breast cancer is so common, why do most women get it without a family history?' The nurse explains that 90–95% of breast cancers have no single identifiable cause. What percentage of breast cancers have NO single identifiable cause?",
 opts:["50–60%","70–80%","90–95%","Nearly 100%"], ans:2,
 exp:"90–95% of breast cancers have no single identifiable cause. Only 5–10% are directly linked to BRCA1/2 mutations. The majority result from complex interactions between multiple risk factors."
},
{id:24,topic:'risk',source:'Risk Factors',
 q:"Mrs. Hessa Al-Rashidi, a 46-year-old woman, is told her mammogram shows dense breast tissue. She asks whether this increases her cancer risk and whether she can do anything about it. The nurse explains that high breast density is classified as what type of risk factor for breast cancer?",
 opts:["Modifiable","Non-modifiable","Protective","Unrelated"], ans:1,
 exp:"High breast density (especially persistent after menopause) is a non-modifiable risk factor that increases relative risk approximately 4-fold. It also makes mammography less sensitive."
},
{id:25,topic:'risk',source:'Risk Factors',
 q:"Ms. Sara Al-Dosari, a 40-year-old woman, comes to the clinic for a breast cancer risk counseling session. The nurse explains that some risk factors can be changed while others cannot. Which of the following is a MODIFIABLE risk factor for breast cancer?",
 opts:["Female gender","BRCA1/2 gene mutation","Alcohol intake (3–4 drinks/day)","Family history of breast cancer"], ans:2,
 exp:"Alcohol intake is a modifiable risk factor — reducing alcohol consumption can lower breast cancer risk. The other options (female gender, BRCA mutations, family history) are non-modifiable."
},
{id:26,topic:'risk',source:'Risk Factors',
 q:"Mrs. Hanan Al-Qahtani, a 35-year-old woman, asks her oncology nurse about lifestyle choices that could protect her from breast cancer. Which of the following is a proven PROTECTIVE factor against breast cancer?",
 opts:["Early menarche","Late menopause","Breastfeeding (long duration)","Nulliparity"], ans:2,
 exp:"Breastfeeding (especially long duration) is a proven protective factor against breast cancer. Early menarche, late menopause, and nulliparity all INCREASE risk."
},
{id:27,topic:'risk',source:'Risk Factors',
 q:"Mrs. Maryam Al-Shammari, a 55-year-old post-menopausal woman with a BMI of 34, asks her nurse if her weight could affect her breast cancer risk. Obesity and weight gain are risk factors for breast cancer primarily in which group?",
 opts:["Pre-menopausal women","Post-menopausal women","Men","All women equally"], ans:1,
 exp:"In post-menopausal women, adipose tissue becomes the primary source of estrogen production (via aromatization). Obesity increases this estrogen production, raising breast cancer risk by approximately 30%."
},
{id:28,topic:'risk',source:'Risk Factors',
 q:"Mrs. Noura Al-Harbi has two first-degree relatives diagnosed with breast cancer before age 50. She asks the oncology nurse what this means for her personal risk level. Which relative risk level is associated with a family history of ≥2 first-degree relatives (FDR) with breast cancer diagnosed before age 50?",
 opts:["Low risk","Moderate risk","High risk (2 FDR → 3× risk, ~40%)","Very high risk (>80%)"], ans:2,
 exp:"Having ≥2 first-degree relatives with breast cancer before age 50 confers high risk: 2 FDRs → approximately 3× increased risk (~40% lifetime risk). Three or more FDRs further increases this risk."
},
{id:29,topic:'risk',source:'Risk Factors',
 q:"Mrs. Wafa Al-Mutairi, a 52-year-old post-menopausal woman, has been taking combined estrogen-progesterone HRT for 5 years. She asks the nurse about her breast cancer risk. Which of the following statements about exogenous hormones and breast cancer risk is CORRECT?",
 opts:["OCP use doubles lifetime risk","HRT use increases risk by 2.9% per year at menopause","Progesterone-only therapy has no risk","All hormone use is equally risky"], ans:1,
 exp:"HRT (combined estrogen-progesterone) use increases breast cancer risk by approximately 2.9% per year of use at menopause. The risk decreases after stopping HRT. Estrogen-only HRT has less risk than combined."
},
{id:30,topic:'risk',source:'Risk Factors',
 q:"Mrs. Daliya Al-Otaibi, a 45-year-old woman, received chest radiation for Hodgkin lymphoma at age 20. She asks her oncology nurse how this affects her breast cancer risk. This represents which type and level of risk?",
 opts:["Modifiable, low risk","Non-modifiable, moderate risk","Non-modifiable, high risk","Modifiable, high risk"], ans:1,
 exp:"History of chest radiation (e.g., for Hodgkin/NHL) is a non-modifiable risk factor that carries moderate risk for subsequent breast cancer. The risk is especially significant if radiation occurred before age 30."
},
{id:31,topic:'risk',source:'Risk Factors',
 q:"Ms. Lana Al-Zahrani, a 34-year-old nulliparous woman, asks if her decision to delay pregnancy could increase her breast cancer risk. First full-term pregnancy after age 30 is associated with what level of breast cancer risk?",
 opts:["High risk","Moderate risk","Low risk","Protective"], ans:2,
 exp:"First full-term pregnancy after age 30 (or nulliparity) is a low risk factor for breast cancer. In contrast, first full-term pregnancy before age 20 is protective, as early pregnancy promotes terminal differentiation of breast cells."
},
{id:32,topic:'risk',source:'Risk Factors',
 q:"During a breast health seminar, a nurse educator is asked which racial/ethnic group has the HIGHEST incidence of breast cancer. Which of the following racial/ethnic groups has the HIGHEST incidence of breast cancer?",
 opts:["Hispanic women","Asian women","African American/non-Hispanic white women","Native American women"], ans:2,
 exp:"Non-Hispanic white women have the highest overall incidence of breast cancer. However, African American women have higher rates of aggressive subtypes (especially TNBC), higher mortality, and are diagnosed at younger ages."
},
{id:33,topic:'genetics',source:'Genetics & Hereditary',
 q:"Mrs. Abeer Al-Rashidi, a 35-year-old woman, is found to have a BRCA1 mutation. Her oncologist explains that BRCA1 mutations are most strongly associated with a specific breast cancer subtype. BRCA1 mutations are most strongly associated with which breast cancer subtype?",
 opts:["Luminal A (ER+/PR+)","HER2-enriched","Triple-negative breast cancer (TNBC)","Luminal B"], ans:2,
 exp:"BRCA1 mutations are particularly associated with triple-negative breast cancer (ER−, PR−, HER2−). BRCA2 mutations are more commonly associated with ER-positive, luminal-type breast cancers."
},
{id:34,topic:'genetics',source:'Genetics & Hereditary',
 q:"Mrs. Iman Al-Qahtani, a 38-year-old woman, is diagnosed with breast cancer and found to carry a BRCA2 mutation. Her genetic counselor explains she is also at significantly increased risk for another cancer. Which cancer is she at significantly increased risk for?",
 opts:["Lung cancer","Ovarian cancer","Colorectal cancer","Thyroid cancer"], ans:1,
 exp:"BRCA2 mutations significantly increase the risk of ovarian cancer (15–20% lifetime risk), pancreatic cancer, and melanoma, in addition to breast cancer. BRCA1 has even higher ovarian cancer risk (~40–44%)."
},
{id:35,topic:'genetics',source:'Genetics & Hereditary',
 q:"Mr. Yousef Al-Harbi, a 28-year-old man, is referred to genetics clinic after his sister was diagnosed with Li-Fraumeni syndrome. The genetic counselor explains the syndrome. Li-Fraumeni syndrome is caused by mutations in which gene?",
 opts:["PTEN","TP53","STK11","CDH1"], ans:1,
 exp:"Li-Fraumeni syndrome is caused by TP53 mutations. It causes early-onset breast cancer, sarcomas, brain tumors, and adrenocortical carcinomas. TP53 is known as the 'guardian of the genome.'"
},
{id:36,topic:'genetics',source:'Genetics & Hereditary',
 q:"Mrs. Fadwa Al-Ghamdi, a 42-year-old woman, is diagnosed with Cowden syndrome (PTEN mutation). Her genetic counselor explains the additional cancer risks associated with this syndrome. Which additional cancer risk is associated with Cowden syndrome besides breast cancer?",
 opts:["Pancreatic cancer","Thyroid cancer","Lung cancer","Leukemia"], ans:1,
 exp:"Cowden syndrome (PTEN mutations) is associated with increased risk of thyroid cancer, endometrial cancer, and colorectal cancer in addition to breast cancer. PTEN is a tumor suppressor gene."
},
{id:37,topic:'genetics',source:'Genetics & Hereditary',
 q:"Mrs. Samia Al-Shehri, a 40-year-old woman with a strong family history of breast cancer, is referred to a genetics clinic. The genetic counselor recommends multigene panel testing. Which genetic testing strategy looks at multiple genes simultaneously for hereditary breast cancer risk?",
 opts:["Single-gene sequential testing","BRCA-only panel","Multigene panel testing","Karyotyping"], ans:2,
 exp:"Multigene panel testing simultaneously analyzes multiple high-, moderate-, and low-penetrance genes (BRCA1, BRCA2, PALB2, ATM, CHEK2, TP53, CDH1, PTEN, etc.) for hereditary breast cancer risk."
},
{id:38,topic:'genetics',source:'Genetics & Hereditary',
 q:"Mrs. Ruba Al-Dosari, a 32-year-old woman, undergoes genetic testing and is found to carry a PALB2 mutation. She asks the nurse what this means for her cancer risk. PALB2 mutations are associated with approximately what lifetime risk of breast cancer?",
 opts:["5–10%","14–35%","50–60%","80–90%"], ans:1,
 exp:"PALB2 mutations are moderate-penetrance mutations associated with approximately 14–35% lifetime risk of breast cancer. PALB2 works with BRCA2 in DNA repair. It is increasingly recognized as clinically significant."
},
{id:39,topic:'genetics',source:'Genetics & Hereditary',
 q:"Mrs. Zainab Al-Mutairi, a 30-year-old woman, carries a BRCA1 mutation inherited from her mother. The genetic counselor explains the inheritance pattern. A genetic counselor explains that a BRCA1 mutation has 'autosomal dominant' inheritance. This means:",
 opts:["Both parents must carry the gene","Only one copy of the mutation causes increased risk","The mutation skips generations","Only daughters can inherit the mutation"], ans:1,
 exp:"Autosomal dominant inheritance means that only ONE copy of the mutated gene (from either parent) is sufficient to cause increased cancer susceptibility. Each child has a 50% chance of inheriting the mutation."
},
{id:40,topic:'genetics',source:'Genetics & Hereditary',
 q:"The oncology nurse is helping Mrs. Basma Al-Zahrani, a 45-year-old woman, understand her breast cancer risk score calculated using a validated tool based on her personal and family history factors. Which tool is this describing?",
 opts:["Determining chemotherapy regimen","Predicting 5-year and lifetime breast cancer risk","Selecting surgical approach","Staging breast cancer"], ans:1,
 exp:"The Gail Model (Breast Cancer Risk Assessment Tool) calculates a woman's 5-year and lifetime risk of developing breast cancer based on age, menarche age, first birth age, biopsies, relatives with BC, and ethnicity."
},
{id:41,topic:'genetics',source:'Genetics & Hereditary',
 q:"Mrs. Taghreed Al-Rashidi, a 36-year-old woman, has multiple family members with both breast and ovarian cancer on her mother's side. She asks the nurse what this pattern suggests. Which finding in family history would most strongly suggest a BRCA hereditary syndrome?",
 opts:["Grandmother with breast cancer at age 75","Multiple family members with breast and ovarian cancer on the same side","Distant cousin with breast cancer","Father with prostate cancer"], ans:1,
 exp:"Multiple family members with breast AND ovarian cancer on the same (paternal or maternal) side strongly suggests BRCA1/2 hereditary syndrome. The breast-ovarian cancer cluster is a hallmark of BRCA hereditary breast and ovarian cancer syndrome."
},
{id:42,topic:'pathology',source:'Pathogenesis & Classification',
 q:"Mrs. Faiza Al-Otaibi, a 48-year-old woman, is told her biopsy shows 'ductal carcinoma in situ (DCIS).' She asks the nurse what this means. DCIS is best described as:",
 opts:["Invasive cancer that has spread to lymph nodes","Cancer cells within the duct lumen without breaching the basement membrane","Lobular cancer with nipple involvement","Metastatic breast cancer"], ans:1,
 exp:"DCIS is a non-invasive cancer where malignant cells are confined within the breast duct lumen and have NOT breached the basement membrane. It is considered Stage 0 and has no metastatic potential if completely excised."
},
{id:43,topic:'pathology',source:'Pathogenesis & Classification',
 q:"Mrs. Huda Al-Qahtani, a 52-year-old woman, asks her nurse what the most common type of invasive breast cancer is, as she wants to understand her diagnosis. The most common type of invasive breast cancer is:",
 opts:["Invasive lobular carcinoma","Invasive ductal carcinoma (IDC)","Mucinous carcinoma","Tubular carcinoma"], ans:1,
 exp:"Invasive ductal carcinoma (IDC), also called invasive carcinoma of no special type (NST), is the most common type of breast cancer, accounting for approximately 70–80% of all breast cancers."
},
{id:44,topic:'pathology',source:'Molecular Classification',
 q:"Mrs. Wajd Al-Harbi, a 44-year-old woman, is diagnosed with triple-negative breast cancer (TNBC). She asks the nurse what 'triple-negative' means. TNBC is characterized by negative expression of:",
 opts:["ER, PR, and HER2","ER, PR, and Ki-67","HER2, EGFR, and VEGF","ER, HER2, and p53"], ans:0,
 exp:"TNBC is defined by negative expression of estrogen receptor (ER), progesterone receptor (PR), and HER2. It accounts for ~15–20% of breast cancers and has the worst prognosis with no targeted therapy options."
},
{id:45,topic:'pathology',source:'Molecular Classification',
 q:"Mrs. Reem Al-Shammari, a 46-year-old woman, is reviewing her pathology results. Her oncologist says she has the best prognosis among all molecular subtypes. Which molecular subtype of breast cancer has the BEST prognosis?",
 opts:["Triple-negative","HER2-enriched","Luminal A","Luminal B"], ans:2,
 exp:"Luminal A (ER+/PR+, HER2−, low Ki-67, low grade) has the best prognosis of all molecular subtypes. It has the lowest recurrence rate and responds well to endocrine therapy."
},
{id:46,topic:'pathology',source:'Molecular Classification',
 q:"Mrs. Hind Al-Ghamdi, a 43-year-old woman, is diagnosed with HER2-enriched breast cancer. The oncologist explains the characteristics of this subtype. HER2-enriched breast cancer is characterized by which of the following?",
 opts:["High ER expression, low HER2","Overexpression/amplification of HER2, ER/PR negative","Low grade, excellent prognosis","High Ki-67, ER positive"], ans:1,
 exp:"HER2-enriched breast cancer shows overexpression or amplification of the HER2 (ERBB2) gene, with negative ER/PR. It was historically aggressive but is now treated with anti-HER2 therapies (trastuzumab, pertuzumab) with improved outcomes."
},
{id:47,topic:'pathology',source:'DCIS & LCIS',
 q:"Mrs. Raniya Al-Dosari, a 39-year-old woman, is diagnosed with LCIS (lobular carcinoma in situ) found incidentally on biopsy. The genetic counselor explains what this finding means for her future risk. A patient diagnosed with LCIS is best counseled that:",
 opts:["LCIS requires immediate mastectomy","LCIS is a marker of increased risk for invasive cancer in BOTH breasts","LCIS is a pre-invasive lesion that will become invasive in 5 years","LCIS is the same as invasive lobular carcinoma"], ans:1,
 exp:"LCIS is a risk marker (not a true carcinoma) indicating increased risk of invasive breast cancer in BOTH breasts — bilateral risk, not just the affected breast. It is typically managed with surveillance and/or chemoprevention."
},
{id:48,topic:'pathology',source:'Special Histologic Types',
 q:"Mrs. Lujain Al-Shehri, a 47-year-old woman, presents with a swollen, red, warm left breast with skin changes resembling an orange peel. She was initially treated for mastitis with antibiotics without improvement. Which clinical finding is MOST characteristic of inflammatory breast cancer?",
 opts:["Single painless lump","Peau d'orange (skin dimpling resembling orange peel)","Nipple discharge only","Axillary lymphadenopathy only"], ans:1,
 exp:"IBC is characterized by peau d'orange (dermal lymphatic obstruction causing skin dimpling), erythema, warmth, and edema affecting >1/3 of the breast. It is aggressive, classified as at least Stage IIIB, and does NOT typically present as a discrete lump."
},
{id:49,topic:'pathology',source:'Molecular Classification',
 q:"Mrs. Nadia Al-Mutairi, a 45-year-old woman, asks the nurse what Ki-67 measures in her pathology report. The nurse explains that Ki-67 is used in breast cancer to measure:",
 opts:["Hormone receptor expression","Tumor proliferation rate","HER2 gene amplification","Lymph node involvement"], ans:1,
 exp:"Ki-67 is a nuclear protein expressed in proliferating cells. High Ki-67 indicates high tumor proliferation rate and is associated with more aggressive tumors (e.g., Luminal B, TNBC). It helps differentiate Luminal A (low Ki-67) from Luminal B (high Ki-67)."
},
{id:50,topic:'pathology',source:'Pathogenesis',
 q:"Mrs. Jamila Al-Zahrani, a 43-year-old woman, is told her biopsy showed atypical ductal hyperplasia (ADH). She asks what this means for her cancer risk. ADH found on biopsy indicates:",
 opts:["The patient has invasive breast cancer","The patient has a 4–5× increased risk of breast cancer","No increased risk if no family history","Requires immediate chemotherapy"], ans:1,
 exp:"ADH (atypical ductal hyperplasia) is a high-risk benign lesion that increases relative breast cancer risk by 4–5 times. Combined with a family history of breast cancer, the risk is approximately 10 times higher."
},
{id:51,topic:'pathology',source:'Histologic Grade',
 q:"A nursing student asks her preceptor how pathologists assess the grade of a breast tumor using the Bloom-Richardson (Nottingham) grading system. In this system, what three features are assessed?",
 opts:["Tumor size, nodal status, metastasis","Tubule formation, nuclear pleomorphism, mitotic rate","ER/PR status, HER2, Ki-67","Lymphovascular invasion, margins, grade"], ans:1,
 exp:"The Bloom-Richardson (Nottingham) grading system scores three features: (1) tubule formation, (2) nuclear pleomorphism (atypia), and (3) mitotic rate. Each is scored 1–3, totaling 3–9 points → Grade 1 (3–5), Grade 2 (6–7), Grade 3 (8–9)."
},
{id:52,topic:'pathology',source:'Special Histologic Types',
 q:"Mrs. Afnan Al-Qahtani, a 50-year-old woman, presents with what appears to be eczema affecting her nipple and areola that has not responded to topical treatment. The dermatologist suspects Paget's disease. Paget's disease of the breast presents with:",
 opts:["Multiple bilateral breast masses","Eczema-like changes of the nipple-areolar complex","Axillary mass only","Nipple inversion without skin changes"], ans:1,
 exp:"Paget's disease presents with eczema-like changes (erythema, scaling, crusting) of the nipple-areolar complex. It is almost always associated with underlying DCIS or invasive carcinoma and requires biopsy for diagnosis."
},
{id:53,topic:'pathology',source:'Molecular Classification',
 q:"Mrs. Ghada Al-Harbi, a 45-year-old woman, is diagnosed with Luminal B breast cancer. She asks how it differs from her friend's Luminal A diagnosis. Luminal B breast cancer differs from Luminal A primarily by:",
 opts:["Being ER negative","Having high Ki-67 and/or HER2 positivity with worse prognosis","Having lower grade","Occurring only in post-menopausal women"], ans:1,
 exp:"Luminal B is ER+/PR± but differs from Luminal A by having high Ki-67 (high proliferation), and/or HER2 positivity. It has a worse prognosis than Luminal A and may require chemotherapy in addition to endocrine therapy."
},
{id:54,topic:'diagnosis',source:'Clinical Manifestations',
 q:"Mrs. Samah Al-Otaibi, a 46-year-old woman, comes to the breast clinic with a breast complaint. She asks the nurse what is the most common presenting symptom that brings women to the clinic with a new diagnosis of breast cancer. The most common presenting symptom of breast cancer is:",
 opts:["Nipple discharge","Skin dimpling","A painless breast lump","Axillary lymph node enlargement"], ans:2,
 exp:"A painless, palpable breast lump is the most common presenting symptom of breast cancer (~70–80% of cases). Pain is uncommon with malignancy; most painful breast lumps are benign (e.g., fibrocystic changes, mastitis)."
},
{id:55,topic:'diagnosis',source:'Diagnostic Workup',
 q:"Ms. Amal Al-Ghamdi, a 40-year-old woman, asks the oncology nurse when she should start getting mammograms. According to the American Cancer Society, the nurse should inform her that annual mammography screening should begin at age:",
 opts:["35 years","40 years","45 years","50 years"], ans:1,
 exp:"The American Cancer Society recommends that women at average risk should have the opportunity to begin annual mammography at age 40. Women at high risk (BRCA, family history) should begin earlier, often at 30 or 10 years before the youngest affected relative."
},
{id:56,topic:'diagnosis',source:'Diagnostic Workup',
 q:"Mrs. Suha Al-Rashidi, a 48-year-old woman, asks her nurse to explain the 'triple assessment' her doctor mentioned. The 'triple assessment' for breast diagnosis includes:",
 opts:["History, physical exam, blood tests","Clinical examination, imaging (mammogram/ultrasound), tissue biopsy","Mammogram, MRI, PET scan","Blood markers, biopsy, staging CT"], ans:1,
 exp:"The triple assessment (or triple test) consists of: (1) clinical examination, (2) imaging (mammography and/or ultrasound), and (3) tissue biopsy (fine needle aspiration cytology or core needle biopsy). All three should be concordant."
},
{id:57,topic:'diagnosis',source:'Diagnostic Workup',
 q:"Mrs. Maysaa Al-Dosari, a 51-year-old woman, receives her mammogram report. Her nurse explains what finding would be MOST suspicious for malignancy. Which finding on mammography is MOST suspicious for malignancy?",
 opts:["Well-circumscribed round mass with smooth margins","Clustered pleomorphic microcalcifications with irregular mass","Benign-appearing calcifications uniformly distributed","Simple cyst with posterior acoustic enhancement"], ans:1,
 exp:"Clustered pleomorphic (varied shape/size) microcalcifications with an irregular spiculated mass is highly suspicious for malignancy (BI-RADS 4–5). Well-circumscribed masses and simple cysts are typically benign features."
},
{id:58,topic:'diagnosis',source:'Diagnostic Workup',
 q:"Mrs. Basmah Al-Shehri, a 47-year-old woman, receives a mammogram report stating 'BI-RADS category 4.' She asks the nurse what this means. BI-RADS category 4 on a mammogram report means:",
 opts:["Negative — routine follow-up","Benign finding — 6-month follow-up","Suspicious — biopsy recommended","Highly suggestive of malignancy — biopsy required"], ans:2,
 exp:"BI-RADS (Breast Imaging Reporting and Data System): 0=incomplete, 1=negative, 2=benign, 3=probably benign (6-month follow-up), 4=suspicious (biopsy recommended), 5=highly suggestive of malignancy, 6=known biopsy-proven malignancy."
},
{id:59,topic:'diagnosis',source:'Diagnostic Workup',
 q:"Mrs. Rawdah Al-Mutairi, a 35-year-old woman, is found to carry a BRCA1 mutation. She asks the nurse if she needs breast MRI in addition to mammography. Breast MRI is indicated in which of the following situations?",
 opts:["Routine screening for average-risk women","Screening for high-risk women (BRCA+ or lifetime risk >20%)","Follow-up after benign biopsy","Annual screening after age 70"], ans:1,
 exp:"Breast MRI is recommended annually (in addition to mammography) for high-risk women including: BRCA1/2 mutation carriers, first-degree relatives of BRCA carriers, lifetime risk >20–25%, history of chest radiation, and certain genetic syndromes."
},
{id:60,topic:'diagnosis',source:'Diagnostic Workup',
 q:"Mrs. Shahd Al-Zahrani, a 48-year-old woman with a newly diagnosed breast cancer, is scheduled for sentinel lymph node biopsy (SLNB). She asks the nurse why this procedure is needed. SLNB is performed to:",
 opts:["Remove all axillary lymph nodes","Identify and biopsy the first lymph node(s) draining the tumor to assess nodal spread","Determine tumor size","Place a chemotherapy port"], ans:1,
 exp:"SLNB identifies the first (sentinel) lymph node(s) that drain the primary tumor. If the sentinel node is negative, axillary dissection can be avoided, reducing morbidity (lymphedema). It is standard of care for clinically node-negative breast cancer."
},
{id:61,topic:'diagnosis',source:'Clinical Manifestations',
 q:"Mrs. Lubna Al-Qahtani, a 43-year-old woman, presents with diffuse redness, warmth, and swelling of her entire right breast that has been worsening over 3 weeks. It does not improve with antibiotics. Which clinical finding is MOST characteristic of inflammatory breast cancer?",
 opts:["A well-defined 2 cm palpable mass","Nipple retraction alone","Diffuse erythema, warmth, edema of the breast, peau d'orange","Bloody nipple discharge"], ans:2,
 exp:"IBC presents with diffuse erythema, warmth, edema, peau d'orange, and rapid progression — often without a discrete mass. It can mimic mastitis. Any 'mastitis' not resolving with antibiotics in a non-lactating woman should be biopsied."
},
{id:62,topic:'diagnosis',source:'Diagnostic Workup',
 q:"Mrs. Noof Al-Harbi, a 52-year-old woman with early-stage ER+/HER2− breast cancer, has an Oncotype DX test ordered. She asks what this test is used for. Oncotype DX is a genomic assay used for which purpose?",
 opts:["HER2 testing","Predicting benefit from chemotherapy in early-stage ER+ breast cancer","Detecting BRCA mutations","Measuring CA 15-3 levels"], ans:1,
 exp:"Oncotype DX is a 21-gene RT-PCR assay used in early-stage ER+/HER2− breast cancer to predict the risk of distant recurrence and determine whether a patient would benefit from adjuvant chemotherapy (TAILORx trial)."
},
{id:63,topic:'staging',source:'TNM Staging',
 q:"Mrs. Wedad Al-Ghamdi's pathology report describes her primary tumor as 'T2.' The oncology nurse explains the TNM staging system. According to TNM staging, a T2 tumor is defined as:",
 opts:["Tumor ≤2 cm","Tumor >2 cm but ≤5 cm","Tumor >5 cm","Any size with chest wall extension"], ans:1,
 exp:"TNM T staging: T1 ≤2 cm, T2 >2 cm but ≤5 cm, T3 >5 cm, T4 any size with chest wall or skin involvement. Knowing exact T criteria is essential for SCFHS exams."
},
{id:64,topic:'staging',source:'TNM Staging',
 q:"Mrs. Sana Al-Rashidi, a 50-year-old woman, is diagnosed with a 3 cm breast tumor, 2 positive movable ipsilateral axillary lymph nodes, and no distant metastasis. What is the TNM clinical stage?",
 opts:["Stage IIA","Stage IIB","Stage IIIA","Stage IIIB"], ans:1,
 exp:"T2 (>2–5 cm) + N1 (1–3 positive axillary nodes) + M0 = Stage IIB. Stage IIA = T0-1 N1 M0 or T2 N0 M0. The presence of N1 disease with T2 = IIB."
},
{id:65,topic:'staging',source:'TNM Staging',
 q:"Mrs. Asma Al-Dosari, a 44-year-old woman, is diagnosed with inflammatory breast cancer. The oncologist explains her stage classification. Inflammatory breast cancer is classified as at least which stage?",
 opts:["Stage IIA","Stage IIB","Stage IIIB","Stage IV"], ans:2,
 exp:"Inflammatory breast cancer is classified as at least Stage IIIB (T4d) regardless of nodal status. If there are supraclavicular nodes, it is Stage IIIC. With distant metastases, it is Stage IV."
},
{id:66,topic:'staging',source:'Prognostic Factors',
 q:"Mrs. Khulood Al-Shehri, a 49-year-old woman with stage II breast cancer, asks the nurse which factor MOST strongly predicts her prognosis. Which of the following is the MOST important prognostic factor in breast cancer?",
 opts:["Tumor size","Histologic grade","Lymph node status","Hormone receptor status"], ans:2,
 exp:"Axillary lymph node status is the single most important prognostic factor in breast cancer. Node-positive disease is associated with significantly higher recurrence rates and lower survival compared to node-negative disease."
},
{id:67,topic:'staging',source:'Prognostic Factors',
 q:"Mrs. Manar Al-Mutairi, a 46-year-old woman, is found to have HER2 overexpression in her breast cancer. She asks what this means for her prognosis and treatment. HER2 overexpression in breast cancer indicates:",
 opts:["Favorable prognosis without targeted therapy","Sensitivity to aromatase inhibitors only","Aggressive tumor behavior but sensitivity to anti-HER2 therapy","Hormone receptor positivity"], ans:2,
 exp:"HER2 overexpression/amplification (15–20% of breast cancers) is associated with aggressive behavior, higher recurrence, and worse prognosis. However, anti-HER2 therapies (trastuzumab, pertuzumab, T-DM1) have dramatically improved outcomes."
},
{id:68,topic:'staging',source:'Prognostic Factors',
 q:"Mrs. Rana Al-Zahrani, a 47-year-old woman, is told her breast cancer staging shows 'N3' disease. The oncology nurse explains what N3 means in TNM staging. N3 in breast cancer TNM staging refers to:",
 opts:["1–3 positive axillary lymph nodes","4–9 positive axillary lymph nodes","Ipsilateral infraclavicular, internal mammary, OR supraclavicular nodes","Contralateral lymph nodes"], ans:2,
 exp:"N staging: N0=no nodes, N1=1–3 axillary or internal mammary nodes, N2=4–9 axillary or internal mammary nodes, N3=≥10 axillary nodes, OR infraclavicular nodes, OR ipsilateral supraclavicular nodes. N3 = most advanced nodal disease."
},
{id:69,topic:'treatment',source:'Surgery',
 q:"Mrs. Nawal Al-Qahtani, a 45-year-old woman with a 1.5 cm ER+ breast cancer, desires to keep her breast and asks about her surgical options. She is eligible for breast-conserving surgery. Which surgical option is most appropriate?",
 opts:["Radical mastectomy","Modified radical mastectomy","Lumpectomy (breast-conserving surgery) with radiation","Prophylactic bilateral mastectomy"], ans:2,
 exp:"Breast-conserving surgery (lumpectomy/partial mastectomy) followed by radiation therapy is appropriate for early-stage breast cancer. Studies (NSABP B-06) show equivalent survival to mastectomy. Preferred when tumor-to-breast ratio allows adequate margins."
},
{id:70,topic:'treatment',source:'Radiation',
 q:"Mrs. Faten Al-Harbi, a 48-year-old woman, had a lumpectomy and asks why her doctor is recommending radiation therapy if 'they got it all.' The nurse explains that radiation therapy after lumpectomy is given to:",
 opts:["Treat lymph node metastases","Reduce local recurrence risk in the remaining breast tissue","Prevent bone metastases","Control systemic disease"], ans:1,
 exp:"Post-lumpectomy radiation therapy reduces local recurrence risk in the remaining breast tissue by approximately 50–70%. It is standard of care after breast-conserving surgery and is part of the equivalence that makes BCT comparable to mastectomy."
},
{id:71,topic:'treatment',source:'Endocrine Therapy',
 q:"Mrs. Zahrah Al-Ghamdi, a 44-year-old pre-menopausal woman with ER+ breast cancer, is prescribed tamoxifen. She asks which patients are appropriate candidates for tamoxifen. Tamoxifen is appropriate for which group of breast cancer patients?",
 opts:["ER-negative, post-menopausal","ER-positive, pre-menopausal or post-menopausal","HER2-positive only","Triple-negative only"], ans:1,
 exp:"Tamoxifen (SERM) is used for ER-positive breast cancer in both pre- and post-menopausal women. It blocks estrogen receptor binding. Aromatase inhibitors (AIs) are preferred in post-menopausal women but tamoxifen remains an option."
},
{id:72,topic:'treatment',source:'Endocrine Therapy',
 q:"Mrs. Siham Al-Rashidi, a 57-year-old post-menopausal woman with ER+/HER2− breast cancer, is prescribed an aromatase inhibitor. She asks why she's getting this instead of tamoxifen. Aromatase inhibitors are used in which patient group?",
 opts:["Pre-menopausal women only","Post-menopausal ER+ breast cancer","HER2+ regardless of ER status","Triple-negative breast cancer"], ans:1,
 exp:"Aromatase inhibitors block peripheral aromatization of androgens to estrogen. They are indicated for post-menopausal ER+ breast cancer. In pre-menopausal women, ovarian function suppression is required before AIs can be used."
},
{id:73,topic:'treatment',source:'Chemotherapy',
 q:"Mrs. Najah Al-Dosari, a 46-year-old woman, is receiving doxorubicin-based chemotherapy. The oncology nurse explains the most important monitoring parameter for this drug. Which chemotherapy agent is associated with a risk of cardiomyopathy and requires cardiac monitoring?",
 opts:["Cyclophosphamide","Taxanes (paclitaxel)","Anthracyclines (doxorubicin)","Capecitabine"], ans:2,
 exp:"Anthracyclines (doxorubicin/Adriamycin, epirubicin) cause dose-dependent cardiotoxicity (cardiomyopathy). The lifetime cumulative dose of doxorubicin should not exceed 550 mg/m² (or 450 mg/m² with prior chest radiation). Cardiac function (LVEF) must be monitored."
},
{id:74,topic:'treatment',source:'Chemotherapy',
 q:"Mrs. Haifa Al-Shehri, a 49-year-old woman, develops numbness and tingling in her hands and feet 2 weeks after starting paclitaxel. The nurse explains this is the drug's primary side effect. Taxanes are primarily associated with which side effect?",
 opts:["Nephrotoxicity","Peripheral neuropathy","Hepatotoxicity","Pulmonary fibrosis"], ans:1,
 exp:"Taxanes cause peripheral neuropathy (numbness, tingling, pain in hands and feet) — a major dose-limiting toxicity. They also cause neutropenia, alopecia, and myalgias. Paclitaxel requires premedication with steroids and antihistamines for hypersensitivity."
},
{id:75,topic:'treatment',source:'Targeted Therapy',
 q:"Mrs. Abla Al-Mutairi, a 43-year-old woman with HER2+ breast cancer, is prescribed trastuzumab (Herceptin). She asks why she needs this specific medication. Trastuzumab is used to treat:",
 opts:["ER-positive breast cancer","Triple-negative breast cancer","HER2-overexpressing breast cancer","Any stage IV breast cancer"], ans:2,
 exp:"Trastuzumab is a monoclonal antibody targeting HER2 (ERBB2). It is used for HER2+ breast cancer in both early (adjuvant) and metastatic settings. It has transformed the prognosis of HER2+ breast cancer. Must monitor for cardiotoxicity (decreased LVEF)."
},
{id:76,topic:'treatment',source:'Targeted Therapy',
 q:"Mrs. Rabab Al-Zahrani, a 47-year-old woman with HER2+ metastatic breast cancer, is prescribed pertuzumab in combination with trastuzumab. She asks why both drugs are given. Pertuzumab is often combined with trastuzumab for HER2+ breast cancer because it:",
 opts:["Blocks a different domain of HER2, enhancing anti-tumor effect","Reduces cardiac toxicity of trastuzumab","Treats ER+ component simultaneously","Prevents bone metastases"], ans:0,
 exp:"Pertuzumab binds to a different epitope (domain II) of HER2 than trastuzumab (domain IV), preventing HER2 dimerization with other HER receptors. Dual HER2 blockade (pertuzumab + trastuzumab + docetaxel = CLEOPATRA regimen) significantly improves outcomes in HER2+ metastatic BC."
},
{id:77,topic:'treatment',source:'Neoadjuvant Therapy',
 q:"Mrs. Thoraya Al-Qahtani, a 45-year-old woman with locally advanced breast cancer, receives neoadjuvant chemotherapy and achieves complete disappearance of cancer cells at surgery. The pathologist reports this as a 'pathologic complete response (pCR).' pCR after neoadjuvant chemotherapy is defined as:",
 opts:["50% reduction in tumor size on imaging","No residual invasive cancer in the breast and lymph nodes at surgery","Complete remission on PET scan","Negative margins after surgery"], ans:1,
 exp:"pCR is defined as no residual invasive cancer in the breast tissue AND lymph nodes at surgical resection (ypT0/is ypN0). It is the strongest predictor of long-term outcomes after neoadjuvant therapy, especially in TNBC and HER2+ breast cancer."
},
{id:78,topic:'treatment',source:'Treatment',
 q:"Mrs. Munira Al-Harbi, a 54-year-old woman with ER+/HER2− metastatic breast cancer, is started on a CDK4/6 inhibitor combined with an aromatase inhibitor. CDK4/6 inhibitors are used in combination with endocrine therapy for:",
 opts:["Triple-negative breast cancer","HER2+/ER− breast cancer","ER+/HER2− metastatic breast cancer","Any metastatic breast cancer"], ans:2,
 exp:"CDK4/6 inhibitors target cyclin-dependent kinases that regulate cell cycle progression. They are approved for ER+/HER2− metastatic breast cancer in combination with aromatase inhibitors or fulvestrant, significantly improving PFS."
},
{id:79,topic:'treatment',source:'Treatment',
 q:"Mrs. Ahlam Al-Ghamdi, a 44-year-old woman with germline BRCA1 mutation and triple-negative metastatic breast cancer, is prescribed olaparib (a PARP inhibitor). PARP inhibitors are indicated for:",
 opts:["ER+ breast cancer regardless of BRCA status","HER2+ breast cancer","Germline BRCA1/2-mutated HER2-negative metastatic breast cancer","Triple-negative BC without BRCA mutation"], ans:2,
 exp:"PARP inhibitors exploit synthetic lethality in BRCA-mutated tumors. They are approved for germline BRCA1/2-mutated, HER2-negative metastatic breast cancer. They work by blocking single-strand DNA repair, causing lethal double-strand breaks in BRCA-deficient cells."
},
{id:80,topic:'treatment',source:'Treatment',
 q:"Mrs. Shatha Al-Rashidi, a 41-year-old woman with high-risk early-stage TNBC, is started on pembrolizumab along with neoadjuvant chemotherapy. She asks why she's getting immunotherapy. Immunotherapy (pembrolizumab) is approved in breast cancer for which subtype?",
 opts:["ER+/HER2− early-stage","HER2+ metastatic","Triple-negative breast cancer (high-risk early-stage or metastatic with PD-L1+)","All subtypes with metastatic disease"], ans:2,
 exp:"Pembrolizumab (anti-PD-1) is approved for: (1) high-risk early-stage TNBC in combination with chemotherapy (neoadjuvant then adjuvant), and (2) PD-L1+ metastatic TNBC. PD-L1 testing (CPS ≥10) is required for metastatic use."
},
{id:81,topic:'treatment',source:'Treatment',
 q:"Mrs. Aqeelah Al-Dosari, a 53-year-old woman with bone metastases from breast cancer, is started on zoledronic acid. The oncology nurse explains the purpose of this medication. Bisphosphonates are used in metastatic breast cancer with bone involvement to:",
 opts:["Treat the primary tumor","Prevent skeletal-related events (SREs) such as fractures and hypercalcemia","Replace chemotherapy","Treat brain metastases"], ans:1,
 exp:"Bisphosphonates and denosumab (RANK-L inhibitor) are used in bone metastatic breast cancer to prevent skeletal-related events (SREs): pathologic fractures, spinal cord compression, hypercalcemia, and need for radiation/surgery to bone."
},
{id:82,topic:'treatment',source:'Surgery',
 q:"Mrs. Intisar Al-Shehri, a 36-year-old woman with BRCA1 mutation, has not yet developed breast cancer and asks about surgical risk reduction options. What is the most effective surgical risk-reduction option for her?",
 opts:["Annual MRI only","Tamoxifen alone","Prophylactic bilateral mastectomy","Watchful waiting"], ans:2,
 exp:"Prophylactic (risk-reducing) bilateral mastectomy reduces breast cancer risk by ~90–95% in BRCA1/2 carriers. It is the most effective risk-reduction strategy for high-risk women, though risk-benefit discussion with the patient is essential."
},
{id:83,topic:'treatment',source:'Endocrine Therapy',
 q:"Mrs. Kawther Al-Mutairi, a 56-year-old post-menopausal woman with node-positive ER+ breast cancer, has completed 5 years of tamoxifen and asks about continuing endocrine therapy. Extended endocrine therapy (beyond 5 years) is recommended for:",
 opts:["All ER+ breast cancer patients","Node-positive or high-risk ER+ post-menopausal patients","Triple-negative breast cancer","HER2+ regardless of ER status"], ans:1,
 exp:"Extended endocrine therapy (7–10 years) is recommended for higher-risk ER+ post-menopausal patients (node-positive, large tumors, high grade). Studies (MA.17, ATLAS) show continued reduction in recurrence beyond 5 years of tamoxifen or AIs."
},
{id:84,topic:'nursing',source:'Nursing Care',
 q:"Mrs. Salha Al-Zahrani is receiving her first dose of doxorubicin (Adriamycin). Several hours after the infusion, she calls the nurse alarmed because her urine has turned red. The nurse should:",
 opts:["Report this as hematuria immediately","Reassure the patient this is a normal side effect of doxorubicin","Stop the infusion and call the physician","Obtain a urine culture"], ans:1,
 exp:"Doxorubicin (Adriamycin) causes red/orange discoloration of urine for 1–2 days after administration — this is a benign side effect and should be anticipated and explained to patients before administration."
},
{id:85,topic:'nursing',source:'Nursing Care',
 q:"Mrs. Mariam Al-Qahtani, a 47-year-old woman on her 3rd cycle of chemotherapy, has an absolute neutrophil count (ANC) of 350/mm³. The nurse's PRIORITY intervention is:",
 opts:["Administer antiemetics","Monitor for signs and symptoms of infection","Encourage oral fluids","Apply warm compresses to IV site"], ans:1,
 exp:"Neutropenia is a life-threatening complication of chemotherapy. The priority nursing intervention is monitoring for signs/symptoms of infection (fever ≥38.3°C is a medical emergency in neutropenic patients). Febrile neutropenia requires immediate broad-spectrum antibiotics."
},
{id:86,topic:'nursing',source:'Nursing Care',
 q:"Mrs. Hessa Al-Harbi, a 50-year-old woman, returns to clinic 4 weeks after axillary lymph node dissection with swelling in her right arm. The nurse recognizes this as:",
 opts:["Deep vein thrombosis","Lymphedema","Seroma formation","Wound infection"], ans:1,
 exp:"Lymphedema is a chronic condition resulting from disruption of lymphatic drainage after axillary lymph node dissection or radiation. It presents as painless arm swelling. Management includes manual lymphatic drainage, compression garments, exercise, and skin care."
},
{id:87,topic:'nursing',source:'Nursing Care',
 q:"Mrs. Lola Al-Ghamdi, a 48-year-old woman, is discharged after axillary lymph node dissection. The nurse provides education on lymphedema prevention. Which of the following instructions is MOST important?",
 opts:["Use the affected arm for blood pressure measurement","Carry heavy bags on the affected side","Avoid injury, cuts, and infections on the affected arm","Apply ice packs to the affected arm daily"], ans:2,
 exp:"Lymphedema prevention education: avoid blood pressure on affected arm, avoid venipuncture, wear compression garment during exercise, avoid extreme heat/cold, protect from injury/infections, maintain healthy weight, and avoid tight clothing."
},
{id:88,topic:'nursing',source:'Nursing Care',
 q:"Mrs. Jawahir Al-Rashidi, a 51-year-old woman undergoing radiation therapy to her breast, presents with severe skin redness and areas of moist, weeping skin. The nurse should:",
 opts:["Apply petroleum-based products (Vaseline) liberally","Notify radiation oncologist and use prescribed wound care products","Apply talcum powder to dry the area","Discontinue radiation therapy immediately"], ans:1,
 exp:"Moist desquamation (Grade 3 radiation dermatitis) requires notification of the radiation team and appropriate wound care (non-adherent dressings, hydrogel, silver-based products per protocol). Avoid petroleum jelly, deodorants, and talcum powder in the radiation field."
},
{id:89,topic:'nursing',source:'Nursing Care',
 q:"Mrs. Khadija Al-Dosari, a 46-year-old woman with HER2+ breast cancer, has been receiving trastuzumab for 3 months. During her follow-up visit, she reports increasing shortness of breath and fatigue with minimal exertion. Which assessment finding would cause the nurse the MOST concern?",
 opts:["Mild fatigue","Alopecia","New onset shortness of breath and decreased exercise tolerance","Nausea after first infusion"], ans:2,
 exp:"Trastuzumab-related cardiotoxicity (decreased LVEF/cardiomyopathy) presents with shortness of breath, decreased exercise tolerance, peripheral edema, and fatigue. LVEF should be monitored every 3 months. If LVEF drops >10% or below normal, trastuzumab may need to be held."
},
{id:90,topic:'nursing',source:'Nursing Care',
 q:"Mrs. Nadia Al-Shehri, a 55-year-old woman with bone metastases, is started on pamidronate infusions. The nurse educates her about the most serious complication to monitor for. A patient receiving bisphosphonate therapy should be monitored for which serious complication?",
 opts:["Renal toxicity and osteonecrosis of the jaw (ONJ)","Cardiotoxicity","Peripheral neuropathy","Hepatotoxicity"], ans:0,
 exp:"Bisphosphonates (pamidronate, zoledronic acid) can cause nephrotoxicity (monitor creatinine) and osteonecrosis of the jaw (ONJ). Patients should have dental evaluation before starting therapy and maintain good oral hygiene. Avoid invasive dental procedures during treatment."
},
{id:91,topic:'nursing',source:'Nursing Care',
 q:"Mrs. Mervat Al-Mutairi, a 45-year-old woman, had a bilateral mastectomy 6 months ago. During her follow-up, she shares that she feels differently about her body and worries about cancer returning. The nurse recognizes this as:",
 opts:["Financial concerns","Altered body image and fear of recurrence","Sleep disturbances","Loss of appetite"], ans:1,
 exp:"Altered body image (changes in femininity, sexuality, attractiveness) and fear of recurrence are the most commonly reported psychosocial issues after mastectomy. Nurses should address these through therapeutic communication, referral to support groups, and counseling."
},
{id:92,topic:'nursing',source:'Nursing Care',
 q:"Mrs. Afrah Al-Zahrani, a 48-year-old woman on letrozole, reports that hot flashes are significantly affecting her sleep and quality of life. She asks about treatment options. Hot flashes from endocrine therapy are BEST managed by:",
 opts:["Resuming estrogen replacement therapy","Non-hormonal interventions: venlafaxine, clonidine, lifestyle modifications","Stopping endocrine therapy","High-dose progesterone"], ans:1,
 exp:"Hot flashes from endocrine therapy cannot be managed with estrogen (contraindicated in breast cancer). Non-hormonal options include: venlafaxine (SNRI), clonidine, gabapentin, and lifestyle modifications (avoid triggers, cool environment, layered clothing)."
},
{id:93,topic:'nursing',source:'Nursing Care',
 q:"Mrs. Rand Al-Qahtani, a 52-year-old woman on tamoxifen, calls the clinic reporting left calf pain and swelling after a long flight. A nurse is educating her about tamoxifen side effects. Which side effect requires IMMEDIATE reporting?",
 opts:["Hot flashes","Vaginal dryness","Leg pain and swelling (possible DVT/PE)","Mild nausea"], ans:2,
 exp:"Tamoxifen increases the risk of thromboembolic events (DVT, pulmonary embolism) and endometrial cancer. Leg pain, swelling, or redness should be reported immediately as signs of DVT. Post-menopausal vaginal bleeding also requires prompt evaluation."
},
{id:94,topic:'nursing',source:'Nursing Care',
 q:"Mrs. Samira Al-Harbi, a 30-year-old woman with newly diagnosed breast cancer, tells the nurse she wants to have children in the future and is worried about her fertility. Which should the nurse do FIRST?",
 opts:["Advise that pregnancy is absolutely contraindicated after breast cancer","Discuss referral to reproductive endocrinology BEFORE starting chemotherapy","Tell the patient to wait 10 years before attempting pregnancy","Advise that fertility is not affected by chemotherapy"], ans:1,
 exp:"Young women with breast cancer who desire future fertility should be referred to reproductive endocrinology BEFORE starting chemotherapy for fertility preservation (embryo/oocyte cryopreservation). Chemotherapy-induced premature ovarian insufficiency is a real risk, especially with alkylating agents."
},
{id:95,topic:'nursing',source:'Nursing Care',
 q:"Mrs. Layla Al-Ghamdi, a 49-year-old woman, has just been diagnosed with metastatic breast cancer. She tells the nurse, 'I just want to give up — there's no hope for me.' What is the best initial nursing response?",
 opts:["Reassure her that modern treatments are very effective","Explain the statistics for metastatic breast cancer","Acknowledge her feelings and assess her support system","Immediately refer to psychiatry"], ans:2,
 exp:"The best initial response is therapeutic presence: acknowledge her feelings with empathy and assess her coping resources and support system. Immediately providing statistics can increase hopelessness; premature reassurance minimizes feelings. Psychosocial support is fundamental in palliative/metastatic care."
},
{id:96,topic:'treatment',source:'Metastatic BC',
 q:"Mrs. Ruba Al-Qahtani, a 54-year-old woman with metastatic breast cancer, develops severe back pain. Imaging confirms bone metastasis. The oncology nurse knows that which site is the MOST common location for breast cancer distant metastasis?",
 opts:["Brain","Lung","Bone","Liver"], ans:2,
 exp:"Bone is the most common site of distant metastasis in breast cancer (~70% of metastatic cases). Other common sites: lung, liver, brain. Bone metastases typically present with pain and can cause hypercalcemia and pathologic fractures."
},
{id:97,topic:'diagnosis',source:'Diagnosis',
 q:"Mrs. Nada Al-Harbi, a 56-year-old woman with metastatic breast cancer, asks why her oncologist orders CA 15-3 blood tests at every visit. The nurse explains that CA 15-3 and CA 27.29 are primarily used for:",
 opts:["Screening in average-risk women","Diagnosing early-stage breast cancer","Monitoring treatment response in metastatic disease","Determining hormone receptor status"], ans:2,
 exp:"CA 15-3 and CA 27.29 are NOT used for breast cancer screening or diagnosis (low sensitivity/specificity). They are used to monitor treatment response and disease progression in metastatic breast cancer — rising levels suggest disease progression."
},
{id:98,topic:'treatment',source:'Treatment',
 q:"Mrs. Eba Al-Ghamdi, a 50-year-old woman with metastatic TNBC, has failed 2 prior chemotherapy regimens. Her oncologist prescribes sacituzumab govitecan (Trodelvy). Sacituzumab govitecan is an ADC approved for which breast cancer type?",
 opts:["ER+ HER2− early stage","Metastatic triple-negative breast cancer after ≥2 prior therapies","HER2+ metastatic only","BRCA-mutated ER+ metastatic"], ans:1,
 exp:"Sacituzumab govitecan (anti-Trop-2 ADC) is approved for metastatic TNBC after ≥2 prior therapies. It delivers SN-38 (active metabolite of irinotecan) directly to cancer cells. It significantly improved PFS and OS in the ASCENT trial."
},
{id:99,topic:'nursing',source:'Nursing Care',
 q:"Mrs. Shurooq Al-Rashidi, a 48-year-old woman on capecitabine, calls the clinic reporting painful redness, peeling, and blistering on the palms of her hands and the soles of her feet. The nurse recognizes this as:",
 opts:["Peripheral neuropathy","Hand-foot syndrome (palmar-plantar erythrodysesthesia)","Contact dermatitis","Radiation recall"], ans:1,
 exp:"Hand-foot syndrome (HFS/PPE) is a common toxicity of capecitabine (and other fluoropyrimidines). Management: dose modification, urea-based creams, avoid pressure/friction, cool water soaks. Severe HFS (Grade 3) requires dose interruption."
},
{id:100,topic:'staging',source:'Staging',
 q:"Mrs. Deema Al-Dosari, a 49-year-old woman with stage II breast cancer, asks her nurse about the newest staging system her doctor mentioned. Which statement about the AJCC 8th edition staging for breast cancer is CORRECT?",
 opts:["It uses only anatomic T, N, M factors","It incorporates biomarkers (ER, PR, HER2, grade) into prognostic staging groups","It eliminates lymph node staging","It only applies to metastatic disease"], ans:1,
 exp:"The AJCC 8th edition breast cancer staging incorporates both anatomic (T, N, M) AND prognostic factors (ER/PR status, HER2 status, histologic grade, Oncotype DX score) to assign clinical/pathologic prognostic stage groups — making it more individualized than anatomic staging alone."
}
];
